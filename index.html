<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101A12">
<title>Forest Ride</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --mist:#EDF2EA; --moss:#6E8C63; --amber:#F0A93B; --deep:#101A12; --rose:#E0503C;
  --num:"Barlow Condensed",system-ui,sans-serif;
  --ui:"Zen Kaku Gothic New",system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--deep);font-family:var(--ui);color:var(--mist)}
canvas{display:block;position:fixed;inset:0;z-index:0}

/* ---------- in-ride HUD ---------- */
#hud{position:fixed;z-index:10;inset:auto 0 0 0;
  padding:0 clamp(14px,3vw,40px) calc(18px + env(safe-area-inset-bottom)) clamp(14px,3vw,40px);
  display:flex;align-items:flex-end;gap:clamp(15px,3.6vw,50px);
  background:linear-gradient(to top,rgba(16,26,18,.76),rgba(16,26,18,.34) 55%,transparent);
  opacity:0;transition:opacity .6s ease;pointer-events:none}
#hud.on{opacity:1}
.metric{display:flex;flex-direction:column;line-height:1}
.metric .label{font-weight:500;font-size:clamp(9px,1.15vh,13px);letter-spacing:.22em;
  color:rgba(237,242,234,.62);margin-bottom:.35em;white-space:nowrap}
.metric .val{font-family:var(--num);font-weight:700;font-variant-numeric:tabular-nums;
  text-shadow:0 2px 14px rgba(0,0,0,.6);white-space:nowrap}
.metric .unit{font-family:var(--num);font-weight:500;font-size:.34em;letter-spacing:.06em;
  color:rgba(237,242,234,.6);margin-left:.22em}
#speed .val{font-size:clamp(54px,12vh,140px)}
.small .val{font-size:clamp(24px,5vh,58px);color:rgba(237,242,234,.9)}
#cadence .val{color:var(--amber)}

#strip{position:fixed;z-index:12;top:calc(10px + env(safe-area-inset-top));left:0;right:0;
  display:none;justify-content:center;gap:clamp(12px,3.4vw,30px);padding:9px 62px;
  background:linear-gradient(to bottom,rgba(16,26,18,.74),transparent);pointer-events:none}
#strip.on{display:flex}
.chip{text-align:center;line-height:1}
.chip .k{font-size:9.5px;letter-spacing:.2em;color:rgba(237,242,234,.55);margin-bottom:5px;white-space:nowrap}
.chip .v{font-family:var(--num);font-weight:700;font-size:clamp(20px,3.4vh,32px);text-shadow:0 2px 10px rgba(0,0,0,.65)}
#pos .v{color:var(--amber)}
.v.up{color:#7FD07F} .v.down{color:var(--rose)}

/* route map */
#map{position:fixed;z-index:14;right:11px;top:calc(62px + env(safe-area-inset-top));
  width:104px;padding:8px 2px 4px;border-radius:3px;background:rgba(16,26,18,.5);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none}
#map.on{display:block}
#map .cap{font-size:9px;letter-spacing:.18em;text-align:center;color:rgba(237,242,234,.55);margin-bottom:4px}
#mapSvg{display:block;width:100%;height:auto}
.mlab{font-family:var(--num);font-weight:700;font-size:9px;fill:rgba(237,242,234,.8)}

#pulse{position:fixed;z-index:11;left:0;right:0;bottom:0;height:2px;background:rgba(237,242,234,.14);pointer-events:none}
#pulse i{position:absolute;inset:0;background:var(--amber);opacity:0;box-shadow:0 0 18px var(--amber)}
#count{position:fixed;z-index:28;inset:0;display:none;place-items:center;pointer-events:none}
#count.on{display:grid}
#count b{font-family:var(--num);font-weight:700;font-size:clamp(110px,30vh,300px);
  color:var(--amber);text-shadow:0 6px 40px rgba(0,0,0,.7);line-height:1}

/* ---------- overlays ---------- */
.screen{position:fixed;z-index:30;inset:0;display:grid;place-items:center;padding:22px;
  overflow-y:auto;background:radial-gradient(120% 90% at 50% 110%,rgba(16,26,18,.95),rgba(16,26,18,.8));
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:opacity .45s ease}
.screen.gone{opacity:0;pointer-events:none}
.card{width:min(430px,100%)}
.eyebrow{font-size:10.5px;letter-spacing:.34em;color:var(--moss);font-weight:700;margin-bottom:12px}
h1{font-family:var(--num);font-weight:700;font-size:clamp(44px,11.5vw,78px);line-height:.86;
  letter-spacing:-.02em;margin-bottom:16px}
h1 em{display:block;font-style:normal;color:var(--amber)}
h2{font-family:var(--num);font-weight:700;font-size:clamp(36px,9.5vw,60px);line-height:.9;margin-bottom:16px}
.stats{display:flex;gap:24px;padding:15px 0 17px;margin-bottom:18px;
  border-top:1px solid rgba(110,140,99,.28);border-bottom:1px solid rgba(110,140,99,.28)}
.stat{line-height:1}
.stat .k{font-size:9.5px;letter-spacing:.2em;color:rgba(237,242,234,.5);margin-bottom:7px}
.stat .v{font-family:var(--num);font-weight:700;font-size:29px}
.stat .v small{font-size:12.5px;font-weight:500;color:rgba(237,242,234,.55);margin-left:2px}
.stat.hot .v{color:var(--amber)}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;padding:11px 0;border:1px solid rgba(110,140,99,.45);border-radius:2px;
  background:transparent;color:rgba(237,242,234,.72);font-family:var(--num);font-weight:600;
  font-size:16px;cursor:pointer}
.seg button.sel{background:rgba(110,140,99,.9);border-color:var(--moss);color:var(--deep)}
.segk{font-size:10px;letter-spacing:.2em;color:rgba(237,242,234,.5);margin:14px 0 8px}
button.go{width:100%;padding:16px;border:0;border-radius:2px;background:var(--amber);color:var(--deep);
  font-family:var(--ui);font-weight:700;font-size:15.5px;letter-spacing:.08em;cursor:pointer;margin-bottom:10px}
button.alt{background:transparent;color:var(--mist);border:1px solid rgba(110,140,99,.5)}
button.go:active{transform:translateY(1px)}
.note{margin-top:12px;font-size:11.5px;line-height:1.75;color:rgba(237,242,234,.45)}
.res{margin-bottom:18px;max-height:44vh;overflow-y:auto}
.res .r{display:flex;align-items:baseline;gap:10px;padding:7px 9px;border-radius:2px;font-size:13.5px}
.res .r.me{background:rgba(240,169,59,.16);box-shadow:inset 2px 0 0 var(--amber)}
.res .r .p{font-family:var(--num);font-weight:700;font-size:18px;width:1.7em;color:rgba(237,242,234,.55)}
.res .r.me .p{color:var(--amber)}
.res .r .n{flex:1}
.res .r .t{font-family:var(--num);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:1px}

/* ---------- controls ---------- */
.icon{position:fixed;z-index:20;top:calc(11px + env(safe-area-inset-top));width:42px;height:42px;
  border:0;border-radius:2px;background:rgba(16,26,18,.55);color:var(--mist);font-size:16px;
  opacity:0;pointer-events:none;transition:opacity .4s;cursor:pointer;font-family:var(--ui)}
.icon.on{opacity:.8;pointer-events:auto}
#gear{right:11px} #stop{left:11px;font-size:12px;font-weight:700}
#panel{position:fixed;z-index:25;top:calc(62px + env(safe-area-inset-top));right:11px;
  width:min(300px,calc(100vw - 22px));padding:19px;background:rgba(16,26,18,.94);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(110,140,99,.3);border-radius:3px;display:none}
#panel.on{display:block}
.row{margin-bottom:19px}.row:last-child{margin-bottom:0}
.row label{display:flex;justify-content:space-between;align-items:baseline;
  font-size:10.5px;letter-spacing:.16em;color:rgba(237,242,234,.62);margin-bottom:9px}
.row label span{font-family:var(--num);font-weight:600;font-size:17px;letter-spacing:0;color:var(--mist)}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:2px;background:rgba(237,242,234,.22);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--amber)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:var(--amber)}
.hint{font-size:10.5px;line-height:1.65;color:rgba(237,242,234,.42);margin-top:8px}
button.ghost{width:100%;padding:11px;background:transparent;color:var(--mist);cursor:pointer;
  border:1px solid rgba(110,140,99,.45);border-radius:2px;font-family:var(--ui);font-size:12.5px;margin-top:8px}
button.ghost.active{background:var(--moss);border-color:var(--moss);color:var(--deep);font-weight:700}
#level{height:3px;background:rgba(237,242,234,.14);margin-top:10px;position:relative;overflow:hidden}
#level i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--moss)}
#level u{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--amber)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="strip">
  <div class="chip" id="pos"><div class="k">順位</div><div class="v">–</div></div>
  <div class="chip" id="left"><div class="k">残り</div><div class="v">–</div></div>
  <div class="chip" id="gap"><div class="k">前の選手</div><div class="v">–</div></div>
  <div class="chip" id="grade"><div class="k">勾配</div><div class="v">0.0%</div></div>
</div>

<div id="map">
  <div class="cap">COURSE</div>
  <svg id="mapSvg" viewBox="0 0 100 196">
    <path id="mRoute" fill="none" stroke="rgba(237,242,234,.32)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="mRivals"></g>
    <circle id="mStart" r="3.4" fill="#6E8C63"/>
    <circle id="mGoal"  r="3.4" fill="#EDF2EA"/>
    <text id="mStartT" class="mlab" text-anchor="middle">S</text>
    <text id="mGoalT"  class="mlab" text-anchor="middle">G</text>
    <circle id="mMe" r="4.6" fill="#F0A93B" stroke="#101A12" stroke-width="1.3"/>
  </svg>
</div>

<div id="hud">
  <div class="metric" id="speed"><div class="label">速度</div><div class="val">0<span class="unit">km/h</span></div></div>
  <div class="metric small" id="cadence"><div class="label">ケイデンス</div><div class="val">0<span class="unit">rpm</span></div></div>
  <div class="metric small" id="dist"><div class="label">距離</div><div class="val">0.00<span class="unit">km</span></div></div>
  <div class="metric small" id="time"><div class="label">時間</div><div class="val">0:00</div></div>
</div>
<div id="pulse"><i></i></div>
<div id="count"><b>3</b></div>

<button id="stop" class="icon">終了</button>
<button id="gear" class="icon" aria-label="設定">⚙</button>
<div id="panel">
  <div class="row">
    <label>検出感度<span id="thV">1.0</span></label>
    <input type="range" id="th" min="0.2" max="3" step="0.1" value="1.0">
    <div id="level"><i></i><u></u></div>
    <div class="hint">緑のバーが黄色い線を越えるとペダル1回転として数えます。</div>
  </div>
  <div class="row">
    <label>ギア比<span id="gvV">20</span></label>
    <input type="range" id="gv" min="0.15" max="0.6" step="0.01" value="0.33">
    <div class="hint">60rpm・平地で出る速度 (km/h)。坂では自動で増減します。</div>
  </div>
  <div class="row">
    <label>音量<span id="volV">70</span></label>
    <input type="range" id="vol" min="0" max="100" step="5" value="70">
    <button class="ghost" id="sim">テスト走行 (センサーなしで動かす)</button>
  </div>
</div>

<div id="start" class="screen">
  <div class="card">
    <div class="eyebrow">STATIONARY BIKE / 森を走る</div>
    <h1>FOREST<em>RIDE</em></h1>
    <div class="stats">
      <div class="stat hot"><div class="k">連続</div><div class="v" id="sStreak">0<small>日</small></div></div>
      <div class="stat"><div class="k">通算</div><div class="v" id="sTotal">0.0<small>km</small></div></div>
      <div class="stat"><div class="k">走行回数</div><div class="v" id="sRides">0<small>回</small></div></div>
    </div>
    <button class="go" id="goFree">フリーライド</button>
    <div class="segk">レース距離</div>
    <div class="seg" id="lenSeg">
      <button data-len="2000">2km</button>
      <button data-len="5000" class="sel">5km</button>
      <button data-len="10000">10km</button>
      <button data-len="20000">20km</button>
    </div>
    <button class="go alt" id="goRace">レースに出る (20人と競争)</button>
    <div class="note" id="startNote">iPhoneを太ももか足首に固定してから開始してください。反応しないときは右上の⚙で感度を調整できます。</div>
  </div>
</div>

<div id="finish" class="screen gone">
  <div class="card">
    <div class="eyebrow" id="fEyebrow">RIDE COMPLETE</div>
    <h2 id="fTitle">おつかれさま</h2>
    <div class="stats" id="fStats"></div>
    <div class="res" id="fRes"></div>
    <button class="go" id="again">もう一度走る</button>
    <button class="go alt" id="home">トップに戻る</button>
  </div>
</div>

<script type="importmap">
{"imports":{"three":"https://unpkg.com/three@0.160.0/build/three.module.js"}}

<script type="module">
import * as THREE from 'three';
const $ = q => document.querySelector(q);
const clamp = (v,a,b) => v<a?a:v>b?b:v;
const lerp  = (a,b,t) => a+(b-a)*t;
const ss = (a,b,x)=>{ const t=clamp((x-a)/(b-a),0,1); return t*t*(3-2*t); };

/* =========================================================
   0. SAVED DATA
   ========================================================= */
const KEY='forestride.v3';
const blank = ()=>({rides:0,totalM:0,streak:0,lastDate:'',ghost:null,ghostAvg:0});
let db = blank(), canSave = true;
try{ const raw = localStorage.getItem(KEY); if(raw) db = Object.assign(blank(), JSON.parse(raw)); }
catch(e){ canSave = false; }
function save(){ if(!canSave) return; try{ localStorage.setItem(KEY, JSON.stringify(db)); }catch(e){ canSave=false; } }
const ymd = d => d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const mmss = s => Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function refreshStats(){
  $('#sStreak').innerHTML = db.streak+'<small>日</small>';
  $('#sTotal').innerHTML  = (db.totalM/1000).toFixed(1)+'<small>km</small>';
  $('#sRides').innerHTML  = db.rides+'<small>回</small>';
  if(!canSave) $('#startNote').textContent = 'この環境では記録を保存できません（プレビュー表示のためです）。走行そのものは問題なく動きます。';
}
refreshStats();

/* =========================================================
   1. THE COURSE  — centreline, elevation, terrain, biomes
   ========================================================= */
const SEG=6, NSEG=100, SPAN=SEG*NSEG, ROAD_W=7.4, GW=26, GHALF=430;
const ZONE=2000, LOOP=ZONE*3, FADE=260;

// horizontal shape of the road
const pathX = s => Math.sin(s*0.0031)*30 + Math.sin(s*0.00085)*54 + Math.sin(s*0.0069+1.2)*9
                 + Math.sin(s*0.0143+0.4)*2.4;
// vertical profile of the road (max grade about 3.5%)
const roadY = s => Math.sin(s*0.0011)*14 + Math.sin(s*0.0027+1.1)*4.6 + Math.sin(s*0.0061+0.6)*1.3;
const gradeAt = s => (roadY(s+6)-roadY(s-6))/12;
// relief of the land either side of the road
const relief = (wx,s) => Math.sin(wx*0.0061+1.3)*5.4 + Math.sin(s*0.0042+2.1)*4.2
                       + Math.sin((wx*0.7+s*0.9)*0.0026)*8.8 + Math.sin(wx*0.021+0.7)*1.0;

function frameAt(s,d){
  const x=pathX(s), z=-(s-d);
  let tx=pathX(s+1)-x, tz=-1;
  const L=Math.hypot(tx,tz); tx/=L; tz/=L;
  return {x,z,tx,tz,px:-tz,pz:tx};
}
const biomeIdx = s => Math.floor((((s%LOOP)+LOOP)%LOOP)/ZONE);
function member(s,idx){
  let p = (((s-idx*ZONE)%LOOP)+LOOP)%LOOP;
  if(p>LOOP/2) p-=LOOP;
  return clamp(Math.min((p+FADE/2)/FADE,(ZONE-p+FADE/2)/FADE),0,1);
}
// ground height at lateral offset d from the road centre
function landY(s,d,wx,r,m1,m2){
  const t = r + relief(wx,s)*(1-m2*0.78);
  let y = r + (t-r)*ss(7,34,Math.abs(d));
  if(m1>0 && d<-12) y -= m1*ss(12,46,-d)*6.5;      // the lake basin
  return y;
}
const waterY = s => roadY(s)-1.6;

/* =========================================================
   2. RENDERER, LIGHT, SKY
   ========================================================= */
const scene = new THREE.Scene();
scene.fog = new THREE.FogExp2(0x9fc8e0, 0.0034);
const camera = new THREE.PerspectiveCamera(72, innerWidth/innerHeight, 0.15, 1400);
const renderer = new THREE.WebGLRenderer({antialias:true, powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
document.body.appendChild(renderer.domElement);
const maxAniso = renderer.capabilities.getMaxAnisotropy();

const hemi = new THREE.HemisphereLight(0xcfe6f7,0x445537,1.05);
const sun  = new THREE.DirectionalLight(0xfff2d4,1.2);
sun.position.set(-160,150,-90);
scene.add(hemi,sun);

function tex(w,h,draw){
  const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d'));
  const t=new THREE.CanvasTexture(c); t.anisotropy=maxAniso; return t;
}
// soft cloud sheet for the sky dome
const cloudTex = tex(512,256,g=>{
  g.fillStyle='#000'; g.fillRect(0,0,512,256);
  for(let i=0;i<130;i++){
    const x=Math.random()*512, y=Math.pow(Math.random(),1.5)*220, r=18+Math.random()*62;
    const grd=g.createRadialGradient(x,y,0,x,y,r);
    const a=0.10+Math.random()*0.30;
    grd.addColorStop(0,'rgba(255,255,255,'+a+')'); grd.addColorStop(1,'rgba(255,255,255,0)');
    g.fillStyle=grd; g.beginPath(); g.ellipse(x,y,r,r*0.52,0,0,6.3); g.fill();
  }
});
cloudTex.wrapS = THREE.RepeatWrapping;

const skyU = {
  top:{value:new THREE.Color(0x4a86c8)}, bot:{value:new THREE.Color(0xbcd8e8)},
  sunC:{value:new THREE.Color(0xfff2d4)}, sunD:{value:new THREE.Vector3(-0.6,0.5,-0.4).normalize()},
  night:{value:0}, clouds:{value:cloudTex}, coff:{value:0}
};
const sky = new THREE.Mesh(new THREE.SphereGeometry(1000,32,20), new THREE.ShaderMaterial({
  side:THREE.BackSide, depthWrite:false, fog:false, uniforms:skyU,
  vertexShader:`varying vec3 vP; void main(){ vP=position; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);} `,
  fragmentShader:`
    varying vec3 vP; uniform vec3 top,bot,sunC,sunD; uniform float night,coff; uniform sampler2D clouds;
    float hash(vec2 p){ return fract(sin(dot(p,vec2(41.3,289.1)))*43758.5453); }
    void main(){
      vec3 d = normalize(vP);
      vec3 c = mix(bot, top, smoothstep(-0.03,0.55,d.y));
      float sd = max(dot(d,normalize(sunD)),0.0);
      c += sunC*pow(sd,600.0)*1.4;
      c += sunC*pow(sd,7.0)*0.16;
      if(night>0.15){
        vec2 sp = floor(d.xz*260.0/max(d.y,0.08));
        float st = step(0.9975, hash(sp));
        c += vec3(st)*night*smoothstep(0.02,0.35,d.y)*0.9;
      }
      if(d.y>0.0){
        vec2 uv = vec2(atan(d.z,d.x)*0.159155+coff, 1.0-clamp(d.y*1.7,0.0,1.0));
        float f = texture2D(clouds,uv).r;
        c = mix(c, mix(vec3(1.0),sunC,0.35)*(1.0-night*0.75), f*smoothstep(0.02,0.30,d.y)*0.85);
      }
      gl_FragColor = vec4(c,1.0);
    }`
}));
sky.frustumCulled=false; scene.add(sky);

// distant mountain ring
function mountains(radius, hMin, hMax, seedOff){
  const N=150, pos=[], idx=[];
  for(let i=0;i<=N;i++){
    const a=i/N*Math.PI*2;
    const h=(hMin+hMax)/2 + Math.sin(a*3.1+seedOff)*((hMax-hMin)/2)
          + Math.sin(a*7.7+seedOff*2)*((hMax-hMin)/3.4) + Math.sin(a*17.3+seedOff)*((hMax-hMin)/7);
    pos.push(Math.cos(a)*radius,-12,Math.sin(a)*radius, Math.cos(a)*radius,h,Math.sin(a)*radius);
  }
  for(let i=0;i<N;i++){ const a=i*2; idx.push(a,a+1,a+2, a+1,a+3,a+2); }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); g.setIndex(idx);
  const m=new THREE.Mesh(g,new THREE.MeshBasicMaterial({fog:false,side:THREE.DoubleSide}));
  m.frustumCulled=false; scene.add(m); return m;
}
const mFar  = mountains(940, 40,130, 0.0);
const mNear = mountains(760, 22, 78, 2.3);

// time of day, one full cycle every 15 km
const TOD=[
  {p:0.00, top:0x8fb6c8, bot:0xe6d3bb, sun:0xffd9a8, si:0.80, hi:0.95, fog:0.0060, gc:0x8a99a0},
  {p:0.14, top:0x5b93cc, bot:0xcfe2ea, sun:0xfff0d4, si:1.15, hi:1.05, fog:0.0034, gc:0x4a5a3c},
  {p:0.42, top:0x3f7dc4, bot:0xbcd8e8, sun:0xfff6df, si:1.30, hi:1.08, fog:0.0030, gc:0x445537},
  {p:0.66, top:0x9a6ea8, bot:0xf0a45f, sun:0xff9040, si:1.00, hi:0.82, fog:0.0044, gc:0x6b5535},
  {p:0.78, top:0x2b3a5e, bot:0xa2596a, sun:0xff8050, si:0.52, hi:0.52, fog:0.0050, gc:0x33303c},
  {p:0.88, top:0x0d1526, bot:0x24344e, sun:0x8fa0cc, si:0.24, hi:0.30, fog:0.0052, gc:0x141c2c},
  {p:1.00, top:0x8fb6c8, bot:0xe6d3bb, sun:0xffd9a8, si:0.80, hi:0.95, fog:0.0060, gc:0x8a99a0},
];
const cA=new THREE.Color(), cB=new THREE.Color(), cT=new THREE.Color();
let nightF=0;
function applyTOD(d,t){
  const p=((d%15000)+15000)%15000/15000;
  let i=0; while(i<TOD.length-2 && TOD[i+1].p<=p) i++;
  const a=TOD[i], b=TOD[i+1], k=(p-a.p)/(b.p-a.p);
  cA.setHex(a.top); cB.setHex(b.top); skyU.top.value.copy(cA).lerp(cB,k);
  cA.setHex(a.bot); cB.setHex(b.bot); skyU.bot.value.copy(cA).lerp(cB,k);
  cA.setHex(a.sun); cB.setHex(b.sun); cT.copy(cA).lerp(cB,k);
  skyU.sunC.value.copy(cT); sun.color.copy(cT);
  sun.intensity=lerp(a.si,b.si,k); hemi.intensity=lerp(a.hi,b.hi,k);
  scene.fog.density=lerp(a.fog,b.fog,k);
  cA.setHex(a.gc); cB.setHex(b.gc); hemi.groundColor.copy(cA).lerp(cB,k);
  hemi.color.copy(skyU.bot.value);
  scene.fog.color.copy(skyU.bot.value);
  nightF=clamp(1-(sun.intensity-0.24)/1.06,0,1);
  skyU.night.value=nightF;
  skyU.coff.value = d*0.000012 + t*0.0006;
  // the sun climbs and sets with the cycle
  const el = Math.sin(p*Math.PI*1.18-0.09)*0.85+0.05;
  skyU.sunD.value.set(-0.62, Math.max(el,-0.2), -0.46).normalize();
  sun.position.copy(skyU.sunD.value).multiplyScalar(220);
  mFar.material.color.copy(skyU.bot.value).lerp(skyU.top.value,0.35).multiplyScalar(0.90);
  mNear.material.color.copy(skyU.bot.value).lerp(skyU.top.value,0.22).multiplyScalar(0.76);
}

const LAT=[];
for(let i=0;i<=GW;i++){
  const u=i/GW*2-1, au=Math.abs(u);
  LAT.push(Math.sign(u)*Math.max(au*62, Math.pow(au,3)*GHALF));
}
const NV=(NSEG+1)*(GW+1);
const tPos=new Float32Array(NV*3), tNrm=new Float32Array(NV*3), tUv=new Float32Array(NV*2), tCol=new Float32Array(NV*3);
const tIdx=[];
for(let i=0;i<NSEG;i++) for(let j=0;j<GW;j++){
  const a=i*(GW+1)+j, b=a+1, c=a+GW+1, d=c+1;
  tIdx.push(a,b,c, b,d,c);
}
const terrGeo=new THREE.BufferGeometry();
terrGeo.setAttribute('position',new THREE.BufferAttribute(tPos,3));
terrGeo.setAttribute('normal',new THREE.BufferAttribute(tNrm,3));

function ribbon(mat){
  const pos=new Float32Array((NSEG+1)*6), uv=new Float32Array((NSEG+1)*4), nrm=new Float32Array((NSEG+1)*6);
  for(let i=1;i<nrm.length;i+=3) nrm[i]=1;
  const idx=[]; for(let i=0;i<NSEG;i++){ const a=i*2; idx.push(a,a+1,a+2, a+1,a+3,a+2); }
  const g=new THREE.BufferGeometry();
  g.setAttribute('position',new THREE.BufferAttribute(pos,3));
  g.setAttribute('normal',new THREE.BufferAttribute(nrm,3));
  g.setAttribute('uv',new THREE.BufferAttribute(uv,2));
  g.setIndex(idx);
  const m=new THREE.Mesh(g,mat); m.frustumCulled=false; scene.add(m);
  return {geo:g,pos,uv};
}
const road  = ribbon(new THREE.MeshLambertMaterial({map:roadTex}));
const water = ribbon(new THREE.MeshLambertMaterial({map:waterTex,transparent:true,opacity:0.9}));

/* =========================================================
   5. SCENERY
   ========================================================= */
const NPROP=430, NLAMP=130, NPOST=140;
const trunkG=new THREE.CylinderGeometry(0.17,0.30,2.4,6); trunkG.translate(0,1.2,0);
const coneG =new THREE.ConeGeometry(1.7,6.4,8);           coneG.translate(0,4.9,0);
const canopG=new THREE.IcosahedronGeometry(2.5,0);        canopG.scale(1,0.86,1); canopG.translate(0,4.5,0);
const bushG =new THREE.IcosahedronGeometry(1,0);          bushG.scale(1,0.72,1);  bushG.translate(0,0.62,0);
const rockG =new THREE.IcosahedronGeometry(1,0);          rockG.scale(1,0.6,1);   rockG.translate(0,0.45,0);
const bldgG =new THREE.BoxGeometry(1,1,1);                bldgG.translate(0,0.5,0);
const poleG =new THREE.CylinderGeometry(0.06,0.09,4.6,5); poleG.translate(0,2.3,0);
const bulbG =new THREE.SphereGeometry(0.22,8,6);          bulbG.translate(0,4.7,0);
const postG =new THREE.BoxGeometry(0.10,1.0,0.10);        postG.translate(0,0.5,0);

const inst=(g,m,n)=>{ const o=new THREE.InstancedMesh(g,m,n); o.frustumCulled=false; o.count=0; scene.add(o); return o; };
const bldgMat=new THREE.MeshLambertMaterial({map:wallTex,emissiveMap:litTex,emissive:0x000000});
const bulbMat=new THREE.MeshLambertMaterial({color:0x4d4a44,emissive:0x000000});
const mTrunk=inst(trunkG,new THREE.MeshLambertMaterial({color:0xffffff}),NPROP);
const mCone =inst(coneG ,new THREE.MeshLambertMaterial({color:0xffffff}),NPROP);
const mCanop=inst(canopG,new THREE.MeshLambertMaterial({color:0xffffff}),NPROP);
const mBush =inst(bushG ,new THREE.MeshLambertMaterial({color:0xffffff}),NPROP);
const mRock =inst(rockG ,new THREE.MeshLambertMaterial({color:0xffffff}),NPROP);
const mBldg =inst(bldgG ,bldgMat,NPROP);
const mPole =inst(poleG ,new THREE.MeshLambertMaterial({color:0x3b3f42}),NLAMP);
const mBulb =inst(bulbG ,bulbMat,NLAMP);
const mPost =inst(postG ,new THREE.MeshLambertMaterial({color:0xe4e2d6}),NPOST);

const CONE_C=[0x38632e,0x456f36,0x2e5228,0x527d3c];
const LEAF_C=[0x5d8f42,0x6d9c4c,0x77a854,0x8c9c46,0xa08a3e];
const BARK_C=[0x584434,0x6a5540,0x4b3b2d,0x8a8073];
const ROCK_C=[0x8d8b80,0x7b7970,0x9a978a];
const BUSH_C=[0x4f7a3c,0x5d8a46,0x446b34];
const WALL_C=[0xffffff,0xeadfcb,0xd4d8dc,0xcbb9a4,0xb6c0c6,0xdcc9b4];
const pick=(a,r)=>a[Math.min(a.length-1,Math.floor(r*a.length))];
const LAMP_ON=new THREE.Color(0xffcf82);

const dummy=new THREE.Object3D(), col=new THREE.Color();
const props=[];
function seedProp(p,s){ p.s=s; p.side=Math.random()<.5?-1:1;
  p.a=Math.random(); p.b=Math.random(); p.c=Math.random(); p.d=Math.random(); p.e=Math.random(); return p; }
for(let i=0;i<NPROP;i++) props.push(seedProp({},(i/NPROP)*SPAN));

/* =========================================================
   6. PER-FRAME WORLD BUILD
   ========================================================= */
const F=[];  for(let i=0;i<=NSEG;i++) F.push({});
function updateWorld(d,t){
  applyTOD(d,t);
  const base=Math.floor(d/SEG)*SEG-SEG*3;
  const uvB=Math.floor(base/10)*10;
  const camX=pathX(d), camXq=Math.round(camX/10)*10;

  for(let i=0;i<=NSEG;i++){
    const s=base+i*SEG, f=frameAt(s,d);
    F[i]={s,f,r:roadY(s),m1:member(s,1),m2:member(s,2)};
  }

  // --- road + water ribbons ---
  for(let i=0;i<=NSEG;i++){
    const {s,f,r,m1}=F[i], o=i*6, u=i*4, h=ROAD_W/2, v=(s-uvB)/10;
    road.pos[o]=f.x-f.px*h; road.pos[o+1]=r+0.05; road.pos[o+2]=f.z-f.pz*h;
    road.pos[o+3]=f.x+f.px*h; road.pos[o+4]=r+0.05; road.pos[o+5]=f.z+f.pz*h;
    road.uv[u]=0; road.uv[u+1]=v; road.uv[u+2]=1; road.uv[u+3]=v;
    const wy=r-1.6, i0=-18, i1=-(18+140*m1);
    water.pos[o]=f.x+f.px*i0; water.pos[o+1]=wy; water.pos[o+2]=f.z+f.pz*i0;
    water.pos[o+3]=f.x+f.px*i1; water.pos[o+4]=wy; water.pos[o+5]=f.z+f.pz*i1;
    water.uv[u]=0; water.uv[u+1]=v; water.uv[u+2]=1; water.uv[u+3]=v;
  }
  road.geo.attributes.position.needsUpdate=road.geo.attributes.uv.needsUpdate=true;
  water.geo.attributes.position.needsUpdate=water.geo.attributes.uv.needsUpdate=true;
  waterTex.offset.y=-t*0.012; waterTex.offset.x=Math.sin(t*0.09)*0.02;

  // --- terrain grid ---
  for(let i=0;i<=NSEG;i++){
    const {s,f,r,m1,m2}=F[i];
    for(let j=0;j<=GW;j++){
      const off=LAT[j], wx=f.x+f.px*off, wz=f.z+f.pz*off;
      const y=landY(s,off,wx,r,m1,m2);
      const k=(i*(GW+1)+j)*3, k2=(i*(GW+1)+j)*2;
      tPos[k]=wx; tPos[k+1]=y; tPos[k+2]=wz;
      tUv[k2]=(wx-camXq)/10; tUv[k2+1]=(s-uvB)/10;
      // colour: sand at the waterline, grey in town, rock on the steeps
      const wl=clamp((waterY(s)+1.3-y)/2.6,0,1)*m1;
      let rr=1,gg=1,bb=1;
      if(wl>0){ rr=lerp(1,1.30,wl); gg=lerp(1,1.20,wl); bb=lerp(1,0.86,wl); }
      if(m2>0){ const q=m2*0.8; rr=lerp(rr,0.80,q); gg=lerp(gg,0.80,q); bb=lerp(bb,0.76,q); }
      const hi=clamp((y-r)/16,0,1);
      if(hi>0){ rr=lerp(rr,1.06,hi*0.6); gg=lerp(gg,0.96,hi*0.6); bb=lerp(bb,0.82,hi*0.6); }
      tCol[k]=rr; tCol[k+1]=gg; tCol[k+2]=bb;
    }
  }
  for(let i=0;i<=NSEG;i++) for(let j=0;j<=GW;j++){
    const iL=j>0?j-1:j, iR=j<GW?j+1:j, iB=i>0?i-1:i, iF=i<NSEG?i+1:i;
    const A=(i*(GW+1)+iR)*3, B=(i*(GW+1)+iL)*3, C=(iF*(GW+1)+j)*3, D=(iB*(GW+1)+j)*3;
    const ux=tPos[A]-tPos[B], uy=tPos[A+1]-tPos[B+1], uz=tPos[A+2]-tPos[B+2];
    const vx=tPos[C]-tPos[D], vy=tPos[C+1]-tPos[D+1], vz=tPos[C+2]-tPos[D+2];
    let nx=uy*vz-uz*vy, ny=uz*vx-ux*vz, nz=ux*vy-uy*vx;
    const L=Math.hypot(nx,ny,nz)||1; const k=(i*(GW+1)+j)*3;
    tNrm[k]=nx/L; tNrm[k+1]=ny/L; tNrm[k+2]=nz/L;
  }
  terrGeo.attributes.position.needsUpdate=terrGeo.attributes.normal.needsUpdate=true;
  terrGeo.attributes.uv.needsUpdate=terrGeo.attributes.color.needsUpdate=true;

  // --- scenery ---
  let nT=0,nC=0,nK=0,nH=0,nR=0,nB=0;
  for(let i=0;i<NPROP;i++){
    const p=props[i];
    if(p.s-d<-30) seedProp(p,p.s+SPAN);
    const bi=biomeIdx(p.s), f=frameAt(p.s,d), r=roadY(p.s);
    const m1=member(p.s,1), m2=member(p.s,2);
    let off, kind=null;
    if(bi===0){
      off=3.2+Math.pow(p.a,0.72)*46;
      kind = p.e<0.60?'cone' : (p.e<0.86?'broad':'bush');
    }else if(bi===1){
      off = p.side<0 ? 4+p.a*10 : 5+p.a*34;
      kind = p.e<0.30?'rock' : (p.e<0.55?'bush' : (p.e<0.80?'broad':null));
    }else{
      if(p.e<0.70){ off=10+p.a*28; kind='bldg'; }
      else if(p.e<0.84){ off=6.5+p.a*4; kind='bush'; }
    }
    if(!kind) continue;
    const dd=(ROAD_W/2+off)*p.side;
    const wx=f.x+f.px*dd, wz=f.z+f.pz*dd;
    const y=landY(p.s,dd,wx,r,m1,m2);
    if(y<waterY(p.s)+0.2) continue;                 // nothing grows in the lake
    dummy.position.set(wx,y,wz);
    dummy.rotation.set(0,p.c*6.283,0);
    if(kind==='cone'){
      const sc=0.6+p.b*1.05; dummy.scale.set(sc*(0.85+p.d*0.3),sc,sc*(0.85+p.d*0.3)); dummy.updateMatrix();
      mTrunk.setMatrixAt(nT,dummy.matrix); mTrunk.setColorAt(nT,col.setHex(pick(BARK_C,p.d))); nT++;
      mCone.setMatrixAt(nC,dummy.matrix);  mCone.setColorAt(nC,col.setHex(pick(CONE_C,p.b)));  nC++;
    }else if(kind==='broad'){
      const sc=(bi===1?0.55:0.7)+p.b*0.8;
      dummy.scale.set(sc*(0.9+p.d*0.35),sc*(0.85+p.d*0.4),sc*(0.9+p.d*0.35)); dummy.updateMatrix();
      mTrunk.setMatrixAt(nT,dummy.matrix); mTrunk.setColorAt(nT,col.setHex(pick(BARK_C,p.d))); nT++;
      mCanop.setMatrixAt(nK,dummy.matrix); mCanop.setColorAt(nK,col.setHex(pick(LEAF_C,p.b))); nK++;
    }else if(kind==='bush'){
      dummy.scale.set(0.7+p.b*1.5,0.6+p.d*1.0,0.7+p.b*1.4); dummy.updateMatrix();
      mBush.setMatrixAt(nH,dummy.matrix); mBush.setColorAt(nH,col.setHex(pick(BUSH_C,p.b))); nH++;
    }else if(kind==='rock'){
      dummy.scale.set(0.5+p.b*1.6,0.35+p.d*0.9,0.5+p.b*1.5); dummy.updateMatrix();
      mRock.setMatrixAt(nR,dummy.matrix); mRock.setColorAt(nR,col.setHex(pick(ROCK_C,p.b))); nR++;
    }else{
      dummy.scale.set(5+p.b*8, 7+p.c*30, 5+p.d*8); dummy.updateMatrix();
      mBldg.setMatrixAt(nB,dummy.matrix); mBldg.setColorAt(nB,col.setHex(pick(WALL_C,p.b))); nB++;
    }
  }
  mTrunk.count=nT; mCone.count=nC; mCanop.count=nK; mBush.count=nH; mRock.count=nR; mBldg.count=nB;
  for(const m of [mTrunk,mCone,mCanop,mBush,mRock,mBldg]){
    m.instanceMatrix.needsUpdate=true; if(m.instanceColor) m.instanceColor.needsUpdate=true;
  }

  // --- lamps (town) and marker posts (country) ---
  let nL=0,nP=0;
  const l0=Math.floor(base/25)*25;
  for(let k=0; k*25<=SPAN+25; k++){
    const s=l0+k*25, f=frameAt(s,d), r=roadY(s);
    const town=member(s,2)>0.5;
    for(const side of [-1,1]){
      const dd=(ROAD_W/2+(town?1.5:0.75))*side;
      const wx=f.x+f.px*dd, wz=f.z+f.pz*dd;
      dummy.rotation.set(0,0,0); dummy.scale.setScalar(1);
      if(town && nL<NLAMP){
        dummy.position.set(wx,r,wz); dummy.updateMatrix();
        mPole.setMatrixAt(nL,dummy.matrix); mBulb.setMatrixAt(nL,dummy.matrix); nL++;
      }else if(!town && nP<NPOST){
        dummy.position.set(wx,r,wz); dummy.updateMatrix();
        mPost.setMatrixAt(nP,dummy.matrix); nP++;
      }
    }
  }
  mPole.count=mBulb.count=nL; mPost.count=nP;
  mPole.instanceMatrix.needsUpdate=mBulb.instanceMatrix.needsUpdate=mPost.instanceMatrix.needsUpdate=true;
  bldgMat.emissive.setScalar(nightF*0.9);
  bulbMat.emissive.setHex(0x000000).lerp(LAMP_ON,nightF);

  sky.position.set(camX,roadY(d),0);
  mFar.position.set(camX,roadY(d)-30,0);  mFar.rotation.y=-d*0.000018;
  mNear.position.set(camX,roadY(d)-24,0); mNear.rotation.y=-d*0.000042;
  return {m0:member(d,0),m1:member(d,1),m2:member(d,2)};
}

/* =========================================================
   7. RIDERS

const wheelG=new THREE.TorusGeometry(0.33,0.045,6,14); wheelG.rotateY(Math.PI/2);

function placeRider(g,s,lane,d,spd,dt){
  const rel=s-d;

  const f=frameAt(s,d);
  g.position.set(f.x+f.px*lane, roadY(s)+0.05, f.z+f.pz*lane);
  g.rotation.y=Math.atan2(-f.tx,-f.tz);
  g.rotation.x=Math.atan(gradeAt(s));
  const u=g.userData;
  u.spin+=spd/3.6/0.33*dt;
  u.wheels[0].rotation.x=u.wheels[1].rotation.x=-u.spin;
  const ph=u.spin*0.32;
  u.legs[0].rotation.x=Math.sin(ph)*0.75;
  u.legs[1].rotation.x=Math.sin(ph+Math.PI)*0.75;
}

let ac=null,master,volume=0.7;

let lfoA,lfoB,lastSong=0;
function noiseBuf(kind){
  const n=ac.sampleRate*4, b=ac.createBuffer(1,n,ac.sampleRate), d=b.getChannelData(0);
  if(kind==='brown'){ let l=0;
    for(let i=0;i<n;i++){ const w=Math.random()*2-1; l=(l+0.019*w)/1.019; d[i]=l*3.4; }
  }else{ let b0=0,b1=0,b2=0,b3=0,b4=0,b5=0,b6=0;
    for(let i=0;i<n;i++){ const w=Math.random()*2-1;
      b0=0.99886*b0+w*0.0555179; b1=0.99332*b1+w*0.0750759; b2=0.96900*b2+w*0.1538520;
      b3=0.86650*b3+w*0.3104856; b4=0.55000*b4+w*0.5329522; b5=-0.7616*b5-w*0.0168980;
      d[i]=(b0+b1+b2+b3+b4+b5+b6+w*0.5362)*0.11; b6=w*0.115926; }
  }
  return b;
}
function initAudio(){
  if(ac) return;
  const AC=window.AudioContext||window.webkitAudioContext; if(!AC) return;
  ac=new AC();
  const smooth=ac.createBiquadFilter(); smooth.type='lowpass'; smooth.frequency.value=7200;
  const comp=ac.createDynamicsCompressor();
  comp.threshold.value=-22; comp.ratio.value=3.5; comp.attack.value=0.02; comp.release.value=0.3;
  master=ac.createGain(); master.gain.value=volume;
  master.connect(smooth); smooth.connect(comp); comp.connect(ac.destination);

  const brown=ac.createBufferSource(); brown.buffer=noiseBuf('brown'); brown.loop=true;
  const pink =ac.createBufferSource(); pink.buffer =noiseBuf('pink');  pink.loop=true;
  const band=(src,type,freq,q)=>{ const f=ac.createBiquadFilter(); f.type=type; f.frequency.value=freq;
    if(q) f.Q.value=q; const g=ac.createGain(); g.gain.value=0; src.connect(f); f.connect(g); g.connect(master); return{f,g}; };

  let x;
  x=band(brown,'lowpass',260,0.7);  fWindLo=x.f; gWindLo=x.g;     // body of the wind
  x=band(pink ,'bandpass',900,0.5); fWindHi=x.f; gWindHi=x.g;     // air rushing past
  x=band(brown,'bandpass',95,3.6);  fTyreA=x.f;  gTyreA=x.g;      // tyre on tarmac
  x=band(brown,'bandpass',250,2.2); fTyreB=x.f;  gTyreB=x.g;
  gCity=band(pink,'lowpass',130).g;
  gLake=band(pink,'bandpass',820,1.3).g;
  gLeaf=band(pink,'bandpass',2500,0.8).g;

  lfoA=ac.createOscillator(); lfoA.frequency.value=0.075;
  lfoB=ac.createOscillator(); lfoB.frequency.value=0.131;
  lfoA.gainNode=ac.createGain(); lfoB.gainNode=ac.createGain();
  lfoA.connect(lfoA.gainNode); lfoA.gainNode.connect(gWindHi.gain);
  lfoB.connect(lfoB.gainNode); lfoB.gainNode.connect(gWindLo.gain);
  lfoA.start(); lfoB.start();

  const dly=ac.createDelay(0.5); dly.delayTime.value=0.14;
  const fb=ac.createGain(); fb.gain.value=0.22;
  const dw=ac.createGain(); dw.gain.value=0.32;
  birdBus=ac.createGain(); birdBus.gain.value=1;
  birdBus.connect(master); birdBus.connect(dly); dly.connect(fb); fb.connect(dly); dly.connect(dw); dw.connect(master);

  brown.start(); pink.start();
}
function birdSong(){
  if(!ac) return;
  const t0=ac.currentTime, n=2+Math.floor(Math.random()*3), base=2300+Math.random()*1300;
  for(let i=0;i<n;i++){

    o.frequency.exponentialRampToValueAtTime(f0*0.80,t+0.11);
    v.frequency.value=46+Math.random()*44; vg.gain.value=f0*0.035;

}

/* =========================================================
   9. PEDAL DETECTION
   ========================================================= */
let TH=1.0, GEAR=0.33;
let lp=null,dc=null,above=false,signal=0,lastBeat=0,periods=[],cadence=0,beatFlash=0;
function onMotion(e){
  const a=e.accelerationIncludingGravity||e.acceleration;
  if(!a||a.x===null) return;
  const m=Math.hypot(a.x||0,a.y||0,a.z||0);
  lp=lp===null?m:lp+(m-lp)*0.35;
  dc=dc===null?m:dc+(lp-dc)*0.02;
  signal=lp-dc;
  const now=performance.now()/1000;
  if(!above&&signal>TH){ above=true; beat(now); }
  else if(above&&signal<-TH*0.55){ above=false; }
}
function beat(now){
  const p=now-lastBeat; lastBeat=now; beatFlash=1;
  if(p>0.33&&p<2.4){ periods.push(p); if(periods.length>5) periods.shift();
    const s=[...periods].sort((x,y)=>x-y); cadence=60/s[s.length>>1]; }
}

   10. RIDE STATE

const GHOST_STEP=50;
let mode='idle',racePhase='',dist=0,speed=0,elapsed=0,countIn=0,raceLen=5000;
let ghostRec=[],ghostNext=0,simOn=false,last=performance.now();

function resetRide(){
  dist=0; speed=0; elapsed=0; cadence=0; periods.length=0; ghostRec=[]; ghostNext=0;
  RIVALS.forEach(r=>{ r.dist=-r.row*2.4; r.spd=0; r.time=null; r.mesh.visible=false; });
  ghostMesh.visible=false;
}
const lenFactor = len => len<=2000?1.07 : len>=20000?0.90 : len>=10000?0.95 : 1.0;
function rivalSpeed(r,t){
  const prog=clamp(r.dist/raceLen,0,1);
  const g=gradeAt(Math.max(r.dist,0));
  const gf=clamp(1-g*(7/r.climb),0.45,1.55);
  return r.base*lenFactor(raceLen)*lerp(r.p0,r.p1,prog)*(1+r.sw*Math.sin(t*r.fq*6.283+r.phase))*gf;
}
function ghostDistAt(t){
  const g=db.ghost; if(!g||g.length<2) return null;
  if(t<=g[0]) return 0;
  if(t>=g[g.length-1]) return (g.length-1)*GHOST_STEP;
  let i=0; while(i<g.length-2&&g[i+1]<=t) i++;
  return (i+(t-g[i])/((g[i+1]-g[i])||1))*GHOST_STEP;
}

   ========================================================= */
const MW=100, MH=196, MPAD=13;
let mapMinX=0, mapSX=1, mapSY=1;
const mRivalDots=[];
function buildMap(len){
  const N=180; let minX=1e9,maxX=-1e9;
  const xs=[];
  for(let i=0;i<=N;i++){ const x=pathX(i/N*len); xs.push(x); if(x<minX)minX=x; if(x>maxX)maxX=x; }
  mapMinX=minX;
  mapSX=(maxX-minX)>0.01 ? (MW-MPAD*2)/(maxX-minX) : 0;
  mapSY=(MH-MPAD*2)/len;
  let dd='';
  for(let i=0;i<=N;i++){
    const px=MPAD+(xs[i]-minX)*mapSX, py=MH-MPAD-(i/N*len)*mapSY;
    dd += (i?'L':'M')+px.toFixed(1)+' '+py.toFixed(1);
  }
  $('#mRoute').setAttribute('d',dd);
  const S=mapPt(0), G=mapPt(len);
  $('#mStart').setAttribute('cx',S.x); $('#mStart').setAttribute('cy',S.y);
  $('#mGoal').setAttribute('cx',G.x);  $('#mGoal').setAttribute('cy',G.y);
  $('#mStartT').setAttribute('x',S.x); $('#mStartT').setAttribute('y',S.y+13);
  $('#mGoalT').setAttribute('x',G.x);  $('#mGoalT').setAttribute('y',G.y-7);
  const box=$('#mRivals'); box.innerHTML='';
  mRivalDots.length=0;
  for(const r of RIVALS){
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('r','2.3');
    c.setAttribute('fill','#'+r.color.toString(16).padStart(6,'0'));
    c.setAttribute('opacity','0.85');
    box.appendChild(c); mRivalDots.push(c);
  }
}
const mapPt = s => ({x:MPAD+(pathX(s)-mapMinX)*mapSX, y:MH-MPAD-s*mapSY});

/* =========================================================
   12. MAIN LOOP
   ========================================================= */
function tick(){
  requestAnimationFrame(tick);
  const now=performance.now();
  let dt=(now-last)/1000; last=now;
  if(dt>0.1) dt=0.1;
  const T=now/1000;

  if(simOn){ const rpm=68+Math.sin(T*0.25)*14; if(T-lastBeat>60/rpm) beat(T); }
  if(T-lastBeat>1.8){ cadence=0; periods.length=0; }

  const grade=gradeAt(dist);
  const gf=clamp(1-grade*7,0.45,1.55);
  const target=cadence*GEAR*gf;
  speed+=(target-speed)*(1-Math.exp(-dt/(target>speed?1.6:2.8)));
  if(speed<0.05) speed=0;

  const racing = mode==='race'&&racePhase==='run';
  const moving = mode==='free'||racing;

  if(mode==='race'&&racePhase==='count'){
    countIn-=dt;
    const n=Math.ceil(countIn);
    $('#count b').textContent = n>0?n:'GO';
    if(countIn<=-0.6){ racePhase='run'; $('#count').classList.remove('on'); }
  }
  if(moving){
    dist+=speed/3.6*dt; elapsed+=dt;
    while(dist>=ghostNext*GHOST_STEP && ghostRec.length<1200){ ghostRec.push(elapsed); ghostNext++; }
  }
  if(racing){
    for(const r of RIVALS){
      const tg=rivalSpeed(r,elapsed);
      r.spd+=(tg-r.spd)*(1-Math.exp(-dt/1.9));
      if(r.time===null){ r.dist+=r.spd/3.6*dt; if(r.dist>=raceLen) r.time=elapsed; }
    }
    if(dist>=raceLen) endRide(true);
  }

  const mem=updateWorld(dist,T);
  updateAudio(speed,mem,T);

  if(mode==='race'){
    for(const r of RIVALS) placeRider(r.mesh, r.dist, r.lane+Math.sin(T*0.3+r.phase)*0.2, dist, r.spd, dt);
  }else if(mode==='free'&&db.ghost){
    const gd=ghostDistAt(elapsed);
    if(gd!==null) placeRider(ghostMesh,gd,1.5,dist,speed,dt); else ghostMesh.visible=false;
  }

  const cx=pathX(dist), cy=roadY(dist);
  const bob=Math.sin(T*Math.PI*2*(cadence/60))*0.018*Math.min(cadence/60,1.4);
  camera.position.set(cx,cy+1.58+bob,0);
  camera.lookAt(pathX(dist+22), roadY(dist+22)+1.32, -22);

  beatFlash=Math.max(0,beatFlash-dt*4.5);
  renderer.render(scene,camera);
  paint(now,grade);
  // if the phone struggles, quietly drop resolution rather than stutter
  fpsAcc+=dt; fpsN++;
  if(fpsAcc>2.5){
    const fps=fpsN/fpsAcc; fpsAcc=0; fpsN=0;
    if(fps<44 && qStep<2){
      qStep++;
      renderer.setPixelRatio(Math.min(devicePixelRatio, qStep===1?1.5:1.0));
      renderer.setSize(innerWidth,innerHeight);
    }
  }
}

  $('#start').classList.add('gone'); $('#finish').classList.add('gone');
  $('#hud').classList.add('on'); $('#gear').classList.add('on'); $('#stop').classList.add('on');
  const hasGhost = kind==='free'&&!!db.ghost;
  $('#strip').classList.toggle('on', true);

  $('#pos .k').textContent = hasGhost?'ゴースト':'順位';

function endRide(finished){
  const wasRace=mode==='race', d=dist, sec=elapsed;
  mode='idle'; racePhase='';
  for(const el of ['#hud','#gear','#stop','#strip','#count','#panel','#map']) $(el).classList.remove('on');
  RIVALS.forEach(r=>r.mesh.visible=false); ghostMesh.visible=false;

  const avg = sec>0 ? d/sec*3.6 : 0;
  let newGhost=false;
  if(d>=300){
    db.rides++; db.totalM+=d;
    const today=ymd(new Date());
    if(db.lastDate!==today){
      const y=ymd(new Date(Date.now()-86400000));
      db.streak = (db.lastDate===y)?db.streak+1:1;
      db.lastDate=today;
    }
    if(ghostRec.length>8 && avg>db.ghostAvg){ db.ghost=ghostRec.slice(0,1200); db.ghostAvg=avg; newGhost=true; }
    save(); refreshStats();
  }
  $('#fEyebrow').textContent = wasRace ? (finished?'RACE FINISHED':'RACE ABANDONED') : 'RIDE COMPLETE';
  const stat=(k,v,u,hot)=>`<div class="stat${hot?' hot':''}"><div class="k">${k}</div><div class="v">${v}<small>${u}</small></div></div>`;
  $('#fStats').innerHTML = stat('距離',(d/1000).toFixed(2),'km')+stat('時間',mmss(sec),'')
    +stat('平均',avg.toFixed(1),'km/h')+stat('連続',db.streak,'日',true);

  if(wasRace&&finished){
    const rows=RIVALS.map(r=>({name:r.name,color:r.color,
      t: r.time!==null ? r.time : sec+(raceLen-r.dist)/Math.max(r.spd/3.6,0.5)}))
      .concat([{name:'あなた',color:0xF0A93B,t:sec,me:true}])
      .sort((a,b)=>a.t-b.t);
    const mine=rows.findIndex(r=>r.me)+1;
    $('#fTitle').textContent = mine===1?'優勝！':mine+'位でゴール';
    $('#fRes').innerHTML = rows.map((r,i)=>
      `<div class="r${r.me?' me':''}"><span class="p">${i+1}</span>
       <span class="n"><span class="dot" style="background:#${r.color.toString(16).padStart(6,'0')}"></span>${r.name}</span>
       <span class="t">${mmss(r.t)}</span></div>`).join('');
  }else{
    $('#fTitle').textContent = newGhost?'ベスト更新':'おつかれさま';
    $('#fRes').innerHTML = newGhost
      ? '<div class="note" style="margin:0">この走行がゴーストとして保存されました。次のフリーライドでは、この自分が前を走ります。</div>'
      : (db.ghost?'<div class="note" style="margin:0">ゴーストの記録は更新されませんでした。</div>':'');
  }
  $('#finish').classList.remove('gone');
}

/* =========================================================
   15. CONTROLS
   ========================================================= */
$('#th').oninput=e=>{ TH=+e.target.value; $('#thV').textContent=TH.toFixed(1); };
$('#gv').oninput=e=>{ GEAR=+e.target.value; $('#gvV').textContent=Math.round(GEAR*60); };
$('#vol').oninput=e=>{ volume=+e.target.value/100; $('#volV').textContent=e.target.value;
  if(master) master.gain.setTargetAtTime(volume, ac.currentTime, 0.1); };
$('#gv').dispatchEvent(new Event('input'));
$('#gear').onclick=()=>$('#panel').classList.toggle('on');
$('#stop').onclick=()=>endRide(false);
$('#sim').onclick=e=>{ simOn=!simOn; e.target.classList.toggle('active',simOn); };
$('#lenSeg').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  raceLen=+b.dataset.len;
  [...$('#lenSeg').children].forEach(x=>x.classList.toggle('sel',x===b));
};

let armed=false;
async function armSensors(){
  if(armed) return; armed=true;
  try{
    if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){
      const res=await DeviceMotionEvent.requestPermission();
      if(res!=='granted') $('#sim').textContent='センサーが拒否されました — テスト走行で動かす';
    }
  }catch(err){ $('#sim').textContent='センサーを使えません — テスト走行で動かす'; }
  window.addEventListener('devicemotion',onMotion);
  initAudio();
  try{ await navigator.wakeLock.request('screen'); }catch(err){}
  document.addEventListener('visibilitychange',async()=>{
    if(document.visibilityState==='visible'){
      last=performance.now();
      try{ await navigator.wakeLock.request('screen'); }catch(err){}
    }
  });
}
let lastKind='free';
async function launch(kind){ lastKind=kind; await armSensors(); if(ac&&ac.state==='suspended') ac.resume(); startRide(kind); }
$('#goFree').onclick=()=>launch('free');
$('#goRace').onclick=()=>launch('race');
$('#again').onclick =()=>launch(lastKind);
$('#home').onclick  =()=>{ $('#finish').classList.add('gone'); $('#start').classList.remove('gone'); };

addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

updateWorld(0,0);
tick();
</script>
