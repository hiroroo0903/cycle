<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#101A12">
<title>Forest Ride</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Barlow+Condensed:wght@500;600;700&family=Zen+Kaku+Gothic+New:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --mist:#EDF2EA; --moss:#6E8C63; --amber:#F0A93B; --deep:#101A12; --rose:#E0503C;
  --num:"Barlow Condensed",system-ui,sans-serif;
  --ui:"Zen Kaku Gothic New",system-ui,sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;overflow:hidden;background:var(--deep);font-family:var(--ui);color:var(--mist)}
canvas{display:block;position:fixed;inset:0;z-index:0}
#hud{position:fixed;z-index:10;inset:auto 0 0 0;
  padding:0 clamp(14px,3vw,40px) calc(18px + env(safe-area-inset-bottom)) clamp(14px,3vw,40px);
  display:flex;align-items:flex-end;gap:clamp(15px,3.6vw,50px);
  background:linear-gradient(to top,rgba(16,26,18,.76),rgba(16,26,18,.32) 55%,transparent);
  opacity:0;transition:opacity .6s ease;pointer-events:none}
#hud.on{opacity:1}
.metric{display:flex;flex-direction:column;line-height:1}
.metric .label{font-weight:500;font-size:clamp(9px,1.15vh,13px);letter-spacing:.22em;
  color:rgba(237,242,234,.62);margin-bottom:.35em;white-space:nowrap}
.metric .val{font-family:var(--num);font-weight:700;font-variant-numeric:tabular-nums;
  text-shadow:0 2px 14px rgba(0,0,0,.6);white-space:nowrap}
.metric .unit{font-family:var(--num);font-weight:500;font-size:.34em;letter-spacing:.06em;
  color:rgba(237,242,234,.6);margin-left:.22em}
#speed .val{font-size:clamp(54px,12vh,140px)}
.small .val{font-size:clamp(24px,5vh,58px);color:rgba(237,242,234,.9)}
#cadence .val{color:var(--amber)}
#strip{position:fixed;z-index:12;top:calc(10px + env(safe-area-inset-top));left:0;right:0;
  display:none;justify-content:center;gap:clamp(12px,3.4vw,30px);padding:9px 108px 9px 62px;
  background:linear-gradient(to bottom,rgba(16,26,18,.74),transparent);pointer-events:none}
#strip.on{display:flex}
.chip{text-align:center;line-height:1}
.chip .k{font-size:9.5px;letter-spacing:.2em;color:rgba(237,242,234,.55);margin-bottom:5px;white-space:nowrap}
.chip .v{font-family:var(--num);font-weight:700;font-size:clamp(20px,3.4vh,32px);text-shadow:0 2px 10px rgba(0,0,0,.65)}
#pos .v{color:var(--amber)}
.v.up{color:#7FD07F} .v.down{color:var(--rose)}
#map{position:fixed;z-index:14;right:11px;top:calc(108px + env(safe-area-inset-top));
  width:104px;padding:8px 2px 4px;border-radius:3px;background:rgba(16,26,18,.5);
  backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:none}
#map.on{display:block}
#map .cap{font-size:9px;letter-spacing:.18em;text-align:center;color:rgba(237,242,234,.55);margin-bottom:4px}
#mapSvg{display:block;width:100%;height:auto}
.mlab{font-family:var(--num);font-weight:700;font-size:9px;fill:rgba(237,242,234,.8)}
#pulse{position:fixed;z-index:11;left:0;right:0;bottom:0;height:2px;background:rgba(237,242,234,.14);pointer-events:none}
#pulse i{position:absolute;inset:0;background:var(--amber);opacity:0;box-shadow:0 0 18px var(--amber)}
#count{position:fixed;z-index:28;inset:0;display:none;place-items:center;pointer-events:none}
#count.on{display:grid}
#count b{font-family:var(--num);font-weight:700;font-size:clamp(110px,30vh,300px);
  color:var(--amber);text-shadow:0 6px 40px rgba(0,0,0,.7);line-height:1}
.screen{position:fixed;z-index:30;inset:0;display:grid;place-items:center;padding:22px;
  overflow-y:auto;background:radial-gradient(120% 90% at 50% 110%,rgba(16,26,18,.95),rgba(16,26,18,.8));
  backdrop-filter:blur(4px);-webkit-backdrop-filter:blur(4px);transition:opacity .45s ease}
.screen.gone{opacity:0;pointer-events:none}
.card{width:min(430px,100%)}
.eyebrow{font-size:10.5px;letter-spacing:.34em;color:var(--moss);font-weight:700;margin-bottom:12px}
h1{font-family:var(--num);font-weight:700;font-size:clamp(44px,11.5vw,78px);line-height:.86;
  letter-spacing:-.02em;margin-bottom:16px}
h1 em{display:block;font-style:normal;color:var(--amber)}
h2{font-family:var(--num);font-weight:700;font-size:clamp(36px,9.5vw,60px);line-height:.9;margin-bottom:16px}
.stats{display:flex;gap:24px;padding:15px 0 17px;margin-bottom:18px;
  border-top:1px solid rgba(110,140,99,.28);border-bottom:1px solid rgba(110,140,99,.28)}
.stat{line-height:1}
.stat .k{font-size:9.5px;letter-spacing:.2em;color:rgba(237,242,234,.5);margin-bottom:7px}
.stat .v{font-family:var(--num);font-weight:700;font-size:29px}
.stat .v small{font-size:12.5px;font-weight:500;color:rgba(237,242,234,.55);margin-left:2px}
.stat.hot .v{color:var(--amber)}
.seg{display:flex;gap:6px;margin-bottom:10px}
.seg button{flex:1;padding:11px 0;border:1px solid rgba(110,140,99,.45);border-radius:2px;
  background:transparent;color:rgba(237,242,234,.72);font-family:var(--num);font-weight:600;font-size:16px;cursor:pointer}
.seg button.sel{background:rgba(110,140,99,.9);border-color:var(--moss);color:var(--deep)}
.segk{font-size:10px;letter-spacing:.2em;color:rgba(237,242,234,.5);margin:14px 0 8px}
button.go{width:100%;padding:16px;border:0;border-radius:2px;background:var(--amber);color:var(--deep);
  font-family:var(--ui);font-weight:700;font-size:15.5px;letter-spacing:.08em;cursor:pointer;margin-bottom:10px}
button.alt{background:transparent;color:var(--mist);border:1px solid rgba(110,140,99,.5)}
button.go:active{transform:translateY(1px)}
.note{margin-top:12px;font-size:11.5px;line-height:1.75;color:rgba(237,242,234,.45)}
.res{margin-bottom:18px;max-height:44vh;overflow-y:auto}
.res .r{display:flex;align-items:baseline;gap:10px;padding:7px 9px;border-radius:2px;font-size:13.5px}
.res .r.me{background:rgba(240,169,59,.16);box-shadow:inset 2px 0 0 var(--amber)}
.res .r .p{font-family:var(--num);font-weight:700;font-size:18px;width:1.7em;color:rgba(237,242,234,.55)}
.res .r.me .p{color:var(--amber)}
.res .r .n{flex:1}
.res .r .t{font-family:var(--num);font-weight:600;font-size:16px;font-variant-numeric:tabular-nums}
.dot{display:inline-block;width:8px;height:8px;border-radius:50%;margin-right:8px;vertical-align:1px}
.icon{position:fixed;z-index:20;top:calc(11px + env(safe-area-inset-top));width:42px;height:42px;
  border:0;border-radius:2px;background:rgba(16,26,18,.55);color:var(--mist);font-size:16px;
  opacity:0;pointer-events:none;transition:opacity .4s;cursor:pointer;font-family:var(--ui)}
.icon.on{opacity:.8;pointer-events:auto}
#gear{right:11px} #cam{right:59px} #stop{left:11px;font-size:12px;font-weight:700}
#panel{position:fixed;z-index:25;top:calc(62px + env(safe-area-inset-top));right:11px;
  width:min(300px,calc(100vw - 22px));padding:19px;background:rgba(16,26,18,.94);
  backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
  border:1px solid rgba(110,140,99,.3);border-radius:3px;display:none}
#panel.on{display:block}
.row{margin-bottom:19px}.row:last-child{margin-bottom:0}
.row label{display:flex;justify-content:space-between;align-items:baseline;
  font-size:10.5px;letter-spacing:.16em;color:rgba(237,242,234,.62);margin-bottom:9px}
.row label span{font-family:var(--num);font-weight:600;font-size:17px;letter-spacing:0;color:var(--mist)}
input[type=range]{width:100%;-webkit-appearance:none;appearance:none;height:2px;background:rgba(237,242,234,.22);outline:none}
input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:22px;height:22px;border-radius:50%;background:var(--amber)}
input[type=range]::-moz-range-thumb{width:22px;height:22px;border:0;border-radius:50%;background:var(--amber)}
.hint{font-size:10.5px;line-height:1.65;color:rgba(237,242,234,.42);margin-top:8px}
button.ghost{width:100%;padding:11px;background:transparent;color:var(--mist);cursor:pointer;
  border:1px solid rgba(110,140,99,.45);border-radius:2px;font-family:var(--ui);font-size:12.5px;margin-top:8px}
button.ghost.active{background:var(--moss);border-color:var(--moss);color:var(--deep);font-weight:700}
#level{height:3px;background:rgba(237,242,234,.14);margin-top:10px;position:relative;overflow:hidden}
#level i{position:absolute;left:0;top:0;bottom:0;width:0;background:var(--moss)}
#level u{position:absolute;top:-3px;bottom:-3px;width:1px;background:var(--amber)}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<div id="strip">
  <div class="chip" id="pos"><div class="k">順位</div><div class="v">–</div></div>
  <div class="chip" id="left"><div class="k">残り</div><div class="v">–</div></div>
  <div class="chip" id="gap"><div class="k">前の選手</div><div class="v">–</div></div>
  <div class="chip" id="grade"><div class="k">勾配</div><div class="v">0.0%</div></div>
</div>

<div id="map">
  <div class="cap">COURSE</div>
  <svg id="mapSvg" viewBox="0 0 100 196">
    <path id="mRoute" fill="none" stroke="rgba(237,242,234,.32)" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
    <g id="mRivals"></g>
    <circle id="mStart" r="3.4" fill="#6E8C63"/>
    <circle id="mGoal"  r="3.4" fill="#EDF2EA"/>
    <text id="mStartT" class="mlab" text-anchor="middle">S</text>
    <text id="mGoalT"  class="mlab" text-anchor="middle">G</text>
    <circle id="mMe" r="4.6" fill="#F0A93B" stroke="#101A12" stroke-width="1.3"/>
  </svg>
</div>

<div id="hud">
  <div class="metric" id="speed"><div class="label">速度</div><div class="val">0<span class="unit">km/h</span></div></div>
  <div class="metric small" id="cadence"><div class="label">ケイデンス</div><div class="val">0<span class="unit">rpm</span></div></div>
  <div class="metric small" id="dist"><div class="label">距離</div><div class="val">0.00<span class="unit">km</span></div></div>
  <div class="metric small" id="time"><div class="label">時間</div><div class="val">0:00</div></div>
</div>
<div id="pulse"><i></i></div>
<div id="count"><b>3</b></div>

<button id="stop" class="icon">終了</button>
<button id="cam"  class="icon" aria-label="視点">👁</button>
<button id="gear" class="icon" aria-label="設定">⚙</button>
<div id="panel">
  <div class="row">
    <label>検出感度<span id="thV">1.0</span></label>
    <input type="range" id="th" min="0.2" max="3" step="0.1" value="1.0">
    <div id="level"><i></i><u></u></div>
    <div class="hint">緑のバーが黄色い線を越えるとペダル1回転として数えます。</div>
  </div>
  <div class="row">
    <label>ギア比<span id="gvV">25</span></label>
    <input type="range" id="gv" min="0.20" max="0.85" step="0.01" value="0.42">
  </div>
  <div class="row">
    <label>スピード感<span id="wsV">1.5</span></label>
    <input type="range" id="ws" min="1" max="2.5" step="0.1" value="1.5">
    <div class="hint">速度計と記録はそのままで、景色の流れる速さだけを変えます。</div>
  </div>
  <div class="row">
    <label>音量<span id="volV">70</span></label>
    <input type="range" id="vol" min="0" max="100" step="5" value="70">
  </div>
  <div class="row">
    <label>画質<span id="qV">高</span></label>
    <input type="range" id="q" min="0" max="2" step="1" value="2">
    <div class="hint">動きがカクつくときは下げてください。</div>
    <button class="ghost" id="sim">テスト走行 (センサーなしで動かす)</button>
  </div>
</div>

<div id="start" class="screen">
  <div class="card">
    <div class="eyebrow">STATIONARY BIKE / 森を走る</div>
    <h1>FOREST<em>RIDE</em></h1>
    <div class="stats">
      <div class="stat hot"><div class="k">連続</div><div class="v" id="sStreak">0<small>日</small></div></div>
      <div class="stat"><div class="k">通算</div><div class="v" id="sTotal">0.0<small>km</small></div></div>
      <div class="stat"><div class="k">走行回数</div><div class="v" id="sRides">0<small>回</small></div></div>
    </div>
    <button class="go" id="goFree">フリーライド</button>
    <div class="segk">レース距離</div>
    <div class="seg" id="lenSeg">
      <button data-len="2000">2km</button>
      <button data-len="5000" class="sel">5km</button>
      <button data-len="10000">10km</button>
      <button data-len="20000">20km</button>
    </div>
    <button class="go alt" id="goRace">レースに出る (20人と競争)</button>
    <div class="note" id="startNote">iPhoneを太ももか足首に固定してから開始してください。走行中は右上の👁で視点、⚙で感度・画質を調整できます。</div>
  </div>
</div>

<div id="finish" class="screen gone">
  <div class="card">
    <div class="eyebrow" id="fEyebrow">RIDE COMPLETE</div>
    <h2 id="fTitle">おつかれさま</h2>
    <div class="stats" id="fStats"></div>
    <div class="res" id="fRes"></div>
    <button class="go" id="again">もう一度走る</button>
    <button class="go alt" id="home">トップに戻る</button>
  </div>
</div>

<script type="importmap">
{"imports":{
  "three":"https://unpkg.com/three@0.160.0/build/three.module.js",
  "three/addons/":"https://unpkg.com/three@0.160.0/examples/jsm/"
}}
</script>
<script type="module">
import * as THREE from 'three';
import {mergeGeometries} from 'three/addons/utils/BufferGeometryUtils.js';
const $ = q => document.querySelector(q);
const clamp=(v,a,b)=>v<a?a:v>b?b:v;
const lerp=(a,b,t)=>a+(b-a)*t;
const ss=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t);};
const V=(x,y,z)=>new THREE.Vector3(x,y,z);

/* ========================================================= 0. SAVED DATA */
const KEY='forestride.v4';
const blank=()=>({rides:0,totalM:0,streak:0,lastDate:'',ghost:null,ghostAvg:0});
let db=blank(), canSave=true;
try{ const raw=localStorage.getItem(KEY); if(raw) db=Object.assign(blank(),JSON.parse(raw)); }catch(e){ canSave=false; }
function save(){ if(!canSave) return; try{ localStorage.setItem(KEY,JSON.stringify(db)); }catch(e){ canSave=false; } }
const ymd=d=>d.getFullYear()+'-'+String(d.getMonth()+1).padStart(2,'0')+'-'+String(d.getDate()).padStart(2,'0');
const mmss=s=>Math.floor(s/60)+':'+String(Math.floor(s%60)).padStart(2,'0');
function refreshStats(){
  $('#sStreak').innerHTML=db.streak+'<small>日</small>';
  $('#sTotal').innerHTML=(db.totalM/1000).toFixed(1)+'<small>km</small>';
  $('#sRides').innerHTML=db.rides+'<small>回</small>';
  if(!canSave) $('#startNote').textContent='この環境では記録を保存できません（プレビュー表示のためです）。走行そのものは問題なく動きます。';
}
refreshStats();

/* ========================================================= 1. COURSE */
const SEG=6,NSEG=100,SPAN=SEG*NSEG,ROAD_W=7.4,GW=26,GHALF=430;
const ZONE=2000,LOOP=ZONE*3,FADE=260;
const pathX=s=>Math.sin(s*0.0031)*30+Math.sin(s*0.00085)*54+Math.sin(s*0.0069+1.2)*9+Math.sin(s*0.0143+0.4)*2.4;
const roadY=s=>Math.sin(s*0.0011)*14+Math.sin(s*0.0027+1.1)*4.6+Math.sin(s*0.0061+0.6)*1.3;
const gradeAt=s=>(roadY(s+6)-roadY(s-6))/12;
const relief=(wx,s)=>Math.sin(wx*0.0061+1.3)*5.4+Math.sin(s*0.0042+2.1)*4.2
                   +Math.sin((wx*0.7+s*0.9)*0.0026)*8.8+Math.sin(wx*0.021+0.7)*1.0;
function frameAt(s,d){
  const x=pathX(s),z=-(s-d);
  let tx=pathX(s+1)-x,tz=-1; const L=Math.hypot(tx,tz); tx/=L; tz/=L;
  return {x,z,tx,tz,px:-tz,pz:tx};
}
const biomeIdx=s=>Math.floor((((s%LOOP)+LOOP)%LOOP)/ZONE);
function member(s,idx){
  let p=(((s-idx*ZONE)%LOOP)+LOOP)%LOOP; if(p>LOOP/2) p-=LOOP;
  return clamp(Math.min((p+FADE/2)/FADE,(ZONE-p+FADE/2)/FADE),0,1);
}
function landY(s,d,wx,r,m1,m2){
  const t=r+relief(wx,s)*(1-m2*0.78);
  let y=r+(t-r)*ss(7,34,Math.abs(d));
  if(m1>0&&d<-12) y-=m1*ss(12,46,-d)*6.5;
  return y;
}
const waterY=s=>roadY(s)-1.6;

/* ========================================================= 2. RENDERER */
const scene=new THREE.Scene();
scene.fog=new THREE.FogExp2(0x9fc8e0,0.0034);
const camera=new THREE.PerspectiveCamera(66,innerWidth/innerHeight,0.15,1400);
const renderer=new THREE.WebGLRenderer({antialias:true,powerPreference:'high-performance'});
renderer.setPixelRatio(Math.min(devicePixelRatio,2));
renderer.setSize(innerWidth,innerHeight);
renderer.outputColorSpace=THREE.SRGBColorSpace;
renderer.toneMapping=THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure=1.05;
renderer.shadowMap.enabled=true;
renderer.shadowMap.type=THREE.PCFSoftShadowMap;
document.body.appendChild(renderer.domElement);
const maxAniso=renderer.capabilities.getMaxAnisotropy();

const hemi=new THREE.HemisphereLight(0xcfe6f7,0x445537,0.75);
const sun=new THREE.DirectionalLight(0xfff2d4,2.4);
sun.castShadow=true;
sun.shadow.mapSize.set(1536,1536);
const SC=sun.shadow.camera;
SC.left=-52; SC.right=52; SC.top=52; SC.bottom=-52; SC.near=1; SC.far=340;
SC.updateProjectionMatrix();
sun.shadow.bias=-0.0012; sun.shadow.normalBias=0.05;
scene.add(hemi,sun,sun.target);

/* ========================================================= 3. TEXTURES */
function cvs(w,h,draw){ const c=document.createElement('canvas'); c.width=w; c.height=h; draw(c.getContext('2d')); return c; }
function texFrom(c,srgb=true){
  const t=new THREE.CanvasTexture(c); t.anisotropy=maxAniso;
  if(srgb) t.colorSpace=THREE.SRGBColorSpace;
  return t;
}
function normalFrom(c,strength){
  const w=c.width,h=c.height,g=c.getContext('2d'),src=g.getImageData(0,0,w,h).data;
  const out=cvs(w,h,()=>{}), og=out.getContext('2d'), img=og.createImageData(w,h);
  const L=(x,y)=>{ const i=(((y+h)%h)*w+((x+w)%w))*4; return (src[i]*0.299+src[i+1]*0.587+src[i+2]*0.114)/255; };
  for(let y=0;y<h;y++) for(let x=0;x<w;x++){
    const dx=(L(x+1,y)-L(x-1,y))*strength, dy=(L(x,y+1)-L(x,y-1))*strength;
    let nx=-dx, ny=-dy, nz=1; const l=Math.hypot(nx,ny,nz);
    const i=(y*w+x)*4;
    img.data[i]=(nx/l*0.5+0.5)*255; img.data[i+1]=(ny/l*0.5+0.5)*255;
    img.data[i+2]=(nz/l*0.5+0.5)*255; img.data[i+3]=255;
  }
  og.putImageData(img,0,0);
  const t=new THREE.CanvasTexture(out); t.anisotropy=maxAniso; return t;
}

const grassC=cvs(256,256,g=>{
  g.fillStyle='#4e6b3c'; g.fillRect(0,0,256,256);
  const cols=['#425c33','#5b7c45','#38502c','#688a4e','#7a8f46','#33482a'];
  for(let i=0;i<16000;i++){
    g.strokeStyle=cols[i%cols.length]; g.lineWidth=1;
    const x=Math.random()*256,y=Math.random()*256,l=3+Math.random()*9,a=(Math.random()-0.5)*0.7;
    g.beginPath(); g.moveTo(x,y); g.lineTo(x+Math.sin(a)*l,y-Math.cos(a)*l); g.stroke();
  }
  for(let i=0;i<70;i++){
    g.fillStyle=['rgba(226,222,150,.5)','rgba(228,180,196,.45)','rgba(200,214,236,.45)'][i%3];
    g.beginPath(); g.arc(Math.random()*256,Math.random()*256,1.2+Math.random()*2,0,6.3); g.fill();
  }
});

function makeRider(frameC,jersey,skin,helmet,shoe,ghost){
  const g=new THREE.Group();

  if(ghost){ mat.transparent=true; mat.opacity=0.4; mat.depthWrite=false; }
  const add=(geo,sh)=>{ const m=new THREE.Mesh(geo,mat); if(sh&&!ghost){ m.castShadow=true; } g.add(m); return m; };
  const body=add(bodyGeo(frameC,jersey,skin,helmet),true);
  const wf=add(WHEEL_G,true); wf.position.set(0,0.35,-0.51);
  const wr=add(WHEEL_G,true); wr.position.set(0,0.35, 0.51);
  const ck=add(CRANK_G,true); ck.position.copy(BB);
  const legs=[];
  for(const sgn of [1,-1]){
    const t=add(legGeo(THIGH,true,jersey,shoe),true);  t.position.set(sgn*HIP.x,HIP.y,HIP.z);
    const s=add(legGeo(SHIN,false,jersey,shoe),true);
    legs.push({sgn,t,s});

  g.userData={wf,wr,ck,legs,spin:0,phase:Math.random()*6.283,body};

}
function animateRider(g,spd,rpm,dt){
  const u=g.userData;
  u.spin+=spd/3.6/0.335*dt;
  u.wf.rotation.x=u.wr.rotation.x=-u.spin;
  u.phase+=rpm/60*6.283*dt;
  u.ck.rotation.x=-u.phase;
  for(const L of u.legs){
    const th=u.phase+(L.sgn>0?0:Math.PI);
    const fz=BB.z+Math.sin(th)*CRANK, fy=BB.y+Math.cos(th)*CRANK;   // pedal position
    const vz=fz-HIP.z, vy=fy-HIP.y;
    const dist=clamp(Math.hypot(vz,vy),0.05,THIGH+SHIN-0.004);
    const phi=Math.atan2(vy,vz);
    const al=Math.acos(clamp((THIGH*THIGH+dist*dist-SHIN*SHIN)/(2*THIGH*dist),-1,1));
    const ta=phi-al;
    const kz=HIP.z+Math.cos(ta)*THIGH, ky=HIP.y+Math.sin(ta)*THIGH;
    const sa=Math.atan2(fy-ky,fz-kz);
    L.t.rotation.x=Math.atan2(-Math.cos(ta),-Math.sin(ta));
    L.s.position.set(L.sgn*HIP.x,ky,kz);
    L.s.rotation.x=Math.atan2(-Math.cos(sa),-Math.sin(sa));
  }
  // the rider rocks very slightly with the pedal stroke
  u.body.rotation.z=Math.sin(u.phase)*0.018;
}
function placeRider(g,s,lane,d,spd,rpm,dt,near){
  const rel=s-d;
  if(rel>340||rel<-60){ g.visible=false; return; }
  g.visible=true;
  const f=frameAt(s,d);
  g.position.set(f.x+f.px*lane,roadY(s)+0.005,f.z+f.pz*lane);
  g.rotation.y=Math.atan2(-f.tx,-f.tz);
  g.rotation.x=Math.atan(gradeAt(s));
  animateRider(g,spd,rpm,dt);
}

  const base=Math.floor(d/SEG)*SEG-SEG*3, uvB=Math.floor(base/10)*10;

      const off=LAT[j],wx=f.x+f.px*off,wz=f.z+f.pz*off;
      const y=landY(s,off,wx,r,m1,m2), k=(i*(GW+1)+j)*3, k2=(i*(GW+1)+j)*2;
      tPos[k]=wx; tPos[k+1]=y; tPos[k+2]=wz;

      if(m2>0){ const q=m2*0.8; rr=lerp(rr,0.82,q); gg=lerp(gg,0.82,q); bb=lerp(bb,0.78,q); }
      const hi=clamp((y-r)/16,0,1);
      if(hi>0){ rr=lerp(rr,1.08,hi*0.6); gg=lerp(gg,0.95,hi*0.6); bb=lerp(bb,0.80,hi*0.6); }
      tCol[k]=rr; tCol[k+1]=gg; tCol[k+2]=bb;

    const A=(i*(GW+1)+iR)*3,B=(i*(GW+1)+iL)*3,C=(iF*(GW+1)+j)*3,D=(iB*(GW+1)+j)*3;
    const ux=tPos[A]-tPos[B],uy=tPos[A+1]-tPos[B+1],uz=tPos[A+2]-tPos[B+2];

  x=band(pinkS,'bandpass',900,0.5); fWindHi=x.f; gWindHi=x.g;
  x=band(brown,'bandpass',95,3.6);  fTyreA=x.f;  gTyreA=x.g;
  x=band(brown,'bandpass',250,2.2); fTyreB=x.f;  gTyreB=x.g;
  gCity=band(pinkS,'lowpass',130).g;
  gLake=band(pinkS,'bandpass',820,1.3).g;
  gLeaf=band(pinkS,'bandpass',2500,0.8).g;
  lfoA=ac.createOscillator(); lfoA.frequency.value=0.075;
  lfoB=ac.createOscillator(); lfoB.frequency.value=0.131;
  lfoA.gainNode=ac.createGain(); lfoB.gainNode=ac.createGain();
  lfoA.connect(lfoA.gainNode); lfoA.gainNode.connect(gWindHi.gain);
  lfoB.connect(lfoB.gainNode); lfoB.gainNode.connect(gWindLo.gain);
  lfoA.start(); lfoB.start();
  const dly=ac.createDelay(0.5); dly.delayTime.value=0.14;
  const fb=ac.createGain(); fb.gain.value=0.22;
  const dw=ac.createGain(); dw.gain.value=0.32;
  birdBus=ac.createGain(); birdBus.gain.value=1;
  birdBus.connect(master); birdBus.connect(dly); dly.connect(fb); fb.connect(dly); dly.connect(dw); dw.connect(master);
  brown.start(); pinkS.start();
}
function birdSong(){
  if(!ac) return;
  const t0=ac.currentTime,n=2+Math.floor(Math.random()*3),base=2300+Math.random()*1300;
  for(let i=0;i<n;i++){
    const t=t0+i*(0.09+Math.random()*0.11);
    const o=ac.createOscillator(),g=ac.createGain(),v=ac.createOscillator(),vg=ac.createGain();
    o.type='sine';
    const f0=base*(0.86+Math.random()*0.34);
    o.frequency.setValueAtTime(f0,t);
    o.frequency.exponentialRampToValueAtTime(f0*(1.12+Math.random()*0.42),t+0.045);
    o.frequency.exponentialRampToValueAtTime(f0*0.80,t+0.11);
    v.frequency.value=46+Math.random()*44; vg.gain.value=f0*0.035;
    v.connect(vg); vg.connect(o.frequency);
    g.gain.setValueAtTime(0.0001,t);
    g.gain.exponentialRampToValueAtTime(0.05,t+0.012);
    g.gain.exponentialRampToValueAtTime(0.0001,t+0.14);
    o.connect(g); g.connect(birdBus);
    o.start(t); o.stop(t+0.16); v.start(t); v.stop(t+0.16);
  }
}
function updateAudio(spd,mem,t){
  if(!ac) return;
  const now=ac.currentTime,v=clamp(spd/42,0,1.2),v2=v*v;
  const set=(p,val,tc)=>p.setTargetAtTime(val,now,tc);
  set(gWindLo.gain,0.055+v2*0.30,0.30); set(fWindLo.frequency,170+v*430,0.4);
  set(gWindHi.gain,0.020+v2*0.155,0.30); set(fWindHi.frequency,620+v*1500,0.4);
  lfoA.gainNode.gain.value=(0.020+v2*0.155)*0.55;
  lfoB.gainNode.gain.value=(0.055+v2*0.30)*0.28;
  set(gTyreA.gain,v*0.20,0.25); set(fTyreA.frequency,88+v*60,0.4);
  set(gTyreB.gain,v*0.10,0.25); set(fTyreB.frequency,230+v*180,0.4);
  set(gCity.gain,mem.m2*0.13,0.7);
  set(gLake.gain,mem.m1*(0.045+0.038*Math.sin(t*1.7)+0.022*Math.sin(t*0.61)),0.35);
  set(gLeaf.gain,mem.m0*(0.022+0.018*Math.sin(t*0.43))*(0.4+v*0.6),0.6);
  if(mem.m0>0.55&&nightF<0.5&&t-lastSong>3.2&&Math.random()<0.016){ lastSong=t; birdSong(); }
}

/* ========================================================= 10. SENSOR */
let TH=1.0,GEAR=0.42;
let lpv=null,dcv=null,above=false,signal=0,lastBeat=0,periods=[],cadence=0,beatFlash=0;
function onMotion(e){
  const a=e.accelerationIncludingGravity||e.acceleration;
  if(!a||a.x===null) return;
  const m=Math.hypot(a.x||0,a.y||0,a.z||0);
  lpv=lpv===null?m:lpv+(m-lpv)*0.35;
  dcv=dcv===null?m:dcv+(lpv-dcv)*0.02;
  signal=lpv-dcv;
  const now=performance.now()/1000;
  if(!above&&signal>TH){ above=true; beat(now); }
  else if(above&&signal<-TH*0.55){ above=false; }
}
function beat(now){
  const p=now-lastBeat; lastBeat=now; beatFlash=1;
  if(p>0.33&&p<2.4){ periods.push(p); if(periods.length>5) periods.shift();
    const s=[...periods].sort((x,y)=>x-y); cadence=60/s[s.length>>1]; }
}

/* ========================================================= 11. STATE */
const GHOST_STEP=50;
let mode='idle',racePhase='',dist=0,speed=0,elapsed=0,countIn=0,raceLen=5000;
let ghostRec=[],ghostNext=0,simOn=false,last=performance.now();
let quality=2,thirdPerson=true;
let WORLD=1.5;   // visual metres travelled per real metre
function resetRide(){
  dist=0;speed=0;elapsed=0;cadence=0;periods.length=0;ghostRec=[];ghostNext=0;
  RIVALS.forEach(r=>{ r.dist=-r.row*2.4; r.spd=0; r.time=null; r.mesh.visible=false; });
  ghostMesh.visible=false; player.visible=false;
}
const lenFactor=len=>len<=2000?1.07:len>=20000?0.90:len>=10000?0.95:1.0;
function rivalSpeed(r,t){
  const prog=clamp(r.dist/raceLen,0,1),g=gradeAt(Math.max(r.dist,0)*WORLD);
  const gf=clamp(1-g*(7/r.climb),0.45,1.55);
  return r.base*lenFactor(raceLen)*lerp(r.p0,r.p1,prog)*(1+r.sw*Math.sin(t*r.fq*6.283+r.phase))*gf;
}
function ghostDistAt(t){
  const g=db.ghost; if(!g||g.length<2) return null;
  if(t<=g[0]) return 0;
  if(t>=g[g.length-1]) return (g.length-1)*GHOST_STEP;
  let i=0; while(i<g.length-2&&g[i+1]<=t) i++;
  return (i+(t-g[i])/((g[i+1]-g[i])||1))*GHOST_STEP;
}
const MW=100,MH=196,MPAD=13;
let mapMinX=0,mapSX=1,mapSY=1;
const mRivalDots=[];
function buildMap(len){
  const N=180; let minX=1e9,maxX=-1e9; const xs=[];
  for(let i=0;i<=N;i++){ const x=pathX(i/N*len*WORLD); xs.push(x); if(x<minX)minX=x; if(x>maxX)maxX=x; }
  mapMinX=minX; mapSX=(maxX-minX)>0.01?(MW-MPAD*2)/(maxX-minX):0; mapSY=(MH-MPAD*2)/len;
  let dd='';
  for(let i=0;i<=N;i++){
    const px=MPAD+(xs[i]-minX)*mapSX, py=MH-MPAD-(i/N*len)*mapSY;
    dd+=(i?'L':'M')+px.toFixed(1)+' '+py.toFixed(1);
  }
  $('#mRoute').setAttribute('d',dd);
  const S=mapPt(0),G=mapPt(len);
  $('#mStart').setAttribute('cx',S.x); $('#mStart').setAttribute('cy',S.y);
  $('#mGoal').setAttribute('cx',G.x);  $('#mGoal').setAttribute('cy',G.y);
  $('#mStartT').setAttribute('x',S.x); $('#mStartT').setAttribute('y',S.y+13);
  $('#mGoalT').setAttribute('x',G.x);  $('#mGoalT').setAttribute('y',G.y-7);
  const box=$('#mRivals'); box.innerHTML=''; mRivalDots.length=0;
  for(const r of RIVALS){
    const c=document.createElementNS('http://www.w3.org/2000/svg','circle');
    c.setAttribute('r','2.3'); c.setAttribute('opacity','0.85');
    c.setAttribute('fill','#'+r.color.toString(16).padStart(6,'0'));
    box.appendChild(c); mRivalDots.push(c);
  }
}
const mapPt=s=>({x:MPAD+(pathX(s*WORLD)-mapMinX)*mapSX, y:MH-MPAD-s*mapSY});

/* ========================================================= 12. LOOP */
let fpsAcc=0,fpsN=0;
function tick(){
  requestAnimationFrame(tick);
  const now=performance.now();
  let dt=(now-last)/1000; last=now;
  if(dt>0.1) dt=0.1;
  const T=now/1000;

  if(simOn){ const rpm=68+Math.sin(T*0.25)*14; if(T-lastBeat>60/rpm) beat(T); }
  if(T-lastBeat>1.8){ cadence=0; periods.length=0; }

  const grade=gradeAt(dist*WORLD), gf=clamp(1-grade*7,0.45,1.55);
  const target=cadence*GEAR*gf;
  speed+=(target-speed)*(1-Math.exp(-dt/(target>speed?1.6:2.8)));
  if(speed<0.05) speed=0;

  const racing=mode==='race'&&racePhase==='run';
  const moving=mode==='free'||racing;
  if(mode==='race'&&racePhase==='count'){
    countIn-=dt;
    const n=Math.ceil(countIn);
    $('#count b').textContent=n>0?n:'GO';
    if(countIn<=-0.6){ racePhase='run'; $('#count').classList.remove('on'); }
  }
  if(moving){
    dist+=speed/3.6*dt; elapsed+=dt;
    while(dist>=ghostNext*GHOST_STEP&&ghostRec.length<1200){ ghostRec.push(elapsed); ghostNext++; }
  }
  if(racing){
    for(const r of RIVALS){
      const tg=rivalSpeed(r,elapsed);
      r.spd+=(tg-r.spd)*(1-Math.exp(-dt/1.9));
      if(r.time===null){ r.dist+=r.spd/3.6*dt; if(r.dist>=raceLen) r.time=elapsed; }
    }
    if(dist>=raceLen) endRide(true);
  }

  const vd=dist*WORLD;                 // where the camera sits in the scenery
  const mem=updateWorld(vd,T);
  updateAudio(speed,mem,T);
  envTimer+=dt;
  if(envTimer>4){ envTimer=0; refreshEnv(); }

  if(mode!=='idle'){
    player.visible=thirdPerson;
    if(thirdPerson) placeRider(player,vd,0,vd,speed*WORLD,Math.max(cadence,speed>0.5?34:0),dt,true);
  }
  if(mode==='race'){
    for(const r of RIVALS)
      placeRider(r.mesh,r.dist*WORLD,r.lane+Math.sin(T*0.3+r.phase)*0.2,vd,r.spd*WORLD,clamp(r.spd*2.6,55,102),dt);
  }else if(mode==='free'&&db.ghost){
    const gd=ghostDistAt(elapsed);
    if(gd!==null) placeRider(ghostMesh,gd*WORLD,1.6,vd,speed*WORLD,Math.max(cadence,40),dt); else ghostMesh.visible=false;
  }

  const cx=pathX(vd),cy=roadY(vd);
  // a wider view, widening further with speed, is what makes speed readable
  const fovBase=53+clamp(speed,0,46)*0.30;
  const want=camera.aspect<1 ? clamp(fovBase/Math.pow(camera.aspect,0.55),fovBase,94) : fovBase;
  if(Math.abs(camera.fov-want)>0.15){ camera.fov=want; camera.updateProjectionMatrix(); }
  if(thirdPerson&&mode!=='idle'){
    const back=3.5+speed*0.012;
    const b=frameAt(vd-back,vd);
    camera.position.set(b.x,roadY(vd-back)+1.50,b.z);
    camera.lookAt(pathX(vd+8),roadY(vd+8)+1.02,-8);
  }else{
    const bob=Math.sin(T*Math.PI*2*(cadence/60))*0.018*Math.min(cadence/60,1.4);
    camera.position.set(cx,cy+1.46+bob,0);
    camera.lookAt(pathX(vd+20),roadY(vd+20)+1.22,-20);
  }

  beatFlash=Math.max(0,beatFlash-dt*4.5);
  renderer.render(scene,camera);
  paintHUD(now,grade);

  fpsAcc+=dt; fpsN++;
  if(fpsAcc>3){
    const fps=fpsN/fpsAcc; fpsAcc=0; fpsN=0;
    if(fps<40&&quality>0) setQuality(quality-1,true);
  }
}
function setQuality(q,auto){
  quality=q;
  $('#q').value=q; $('#qV').textContent=['低','中','高'][q];
  renderer.setPixelRatio(Math.min(devicePixelRatio,[1.0,1.4,2.0][q]));
  renderer.setSize(innerWidth,innerHeight);
  renderer.shadowMap.enabled=q>0;
  sun.castShadow=q>0;
  sun.shadow.mapSize.set(q>1?1536:1024,q>1?1536:1024);
  if(sun.shadow.map){ sun.shadow.map.dispose(); sun.shadow.map=null; }
  scene.traverse(o=>{ if(o.material) o.material.needsUpdate=true; });
}

/* ========================================================= 13. HUD */
const elS=$('#speed .val'),elC=$('#cadence .val'),elD=$('#dist .val'),elT=$('#time .val');
const pulse=$('#pulse i'),lvl=$('#level i'),mark=$('#level u');
const vPos=$('#pos .v'),vLeft=$('#left .v'),vGap=$('#gap .v'),kGap=$('#gap .k'),vGrade=$('#grade .v');
let lastPaint=0;
function paintHUD(now,grade){
  pulse.style.opacity=beatFlash.toFixed(2);
  if(now-lastPaint<110) return;
  lastPaint=now;
  elS.innerHTML=speed.toFixed(1)+'<span class="unit">km/h</span>';
  elC.innerHTML=Math.round(cadence)+'<span class="unit">rpm</span>';
  elD.innerHTML=(dist/1000).toFixed(2)+'<span class="unit">km</span>';
  elT.textContent=mmss(elapsed);
  const gp=grade*100;
  vGrade.textContent=(gp>=0?'+':'')+gp.toFixed(1)+'%';
  vGrade.className='v'+(gp>0.4?' down':gp<-0.4?' up':'');
  if(mode==='race'){
    const all=RIVALS.map(r=>({d:r.dist})).concat([{d:dist,me:true}]).sort((a,b)=>b.d-a.d);
    const rank=all.findIndex(x=>x.me)+1;
    vPos.textContent=rank+'/'+all.length;
    vLeft.textContent=Math.max(0,(raceLen-dist)/1000).toFixed(2)+'km';
    if(rank===1){ kGap.textContent='後続'; vGap.textContent='+'+Math.round(dist-all[1].d)+'m'; vGap.className='v up'; }
    else{ kGap.textContent='前の選手'; vGap.textContent='-'+Math.round(all[rank-2].d-dist)+'m'; vGap.className='v down'; }
    const me=mapPt(clamp(dist,0,raceLen));
    $('#mMe').setAttribute('cx',me.x); $('#mMe').setAttribute('cy',me.y);
    for(let i=0;i<mRivalDots.length;i++){
      const p=mapPt(clamp(RIVALS[i].dist,0,raceLen));
      mRivalDots[i].setAttribute('cx',p.x); mRivalDots[i].setAttribute('cy',p.y);
    }
  }else if(mode==='free'&&db.ghost){
    const gd=ghostDistAt(elapsed);
    if(gd!==null){ const diff=dist-gd;
      vPos.textContent=diff>=0?'リード':'ビハインド';
      vLeft.textContent=(diff>=0?'+':'')+Math.round(diff)+'m'; }
  }
  if($('#panel').classList.contains('on')){
    lvl.style.width=clamp(signal,0,3)/3*100+'%';
    mark.style.left=TH/3*100+'%';
  }
}

/* ========================================================= 14. START / FINISH */
function startRide(kind){
  resetRide();
  mode=kind; racePhase=kind==='race'?'count':''; countIn=3.0;
  $('#start').classList.add('gone'); $('#finish').classList.add('gone');
  for(const el of ['#hud','#gear','#stop','#cam','#strip']) $(el).classList.add('on');
  const hasGhost=kind==='free'&&!!db.ghost;
  $('#gap').style.display=kind==='race'?'block':'none';
  $('#pos').style.display=(kind==='race'||hasGhost)?'block':'none';
  $('#left').style.display=(kind==='race'||hasGhost)?'block':'none';
  $('#pos .k').textContent=hasGhost?'ゴースト':'順位';
  $('#left .k').textContent=hasGhost?'差':'残り';
  $('#count').classList.toggle('on',kind==='race');
  $('#map').classList.toggle('on',kind==='race');
  if(kind==='race') buildMap(raceLen);
  refreshEnv();
}
function endRide(finished){
  const wasRace=mode==='race',d=dist,sec=elapsed;
  mode='idle'; racePhase='';
  for(const el of ['#hud','#gear','#stop','#cam','#strip','#count','#panel','#map']) $(el).classList.remove('on');
  RIVALS.forEach(r=>r.mesh.visible=false);
  ghostMesh.visible=false; player.visible=false;
  const avg=sec>0?d/sec*3.6:0;
  let newGhost=false;
  if(d>=300){
    db.rides++; db.totalM+=d;
    const today=ymd(new Date());
    if(db.lastDate!==today){
      const y=ymd(new Date(Date.now()-86400000));
      db.streak=(db.lastDate===y)?db.streak+1:1; db.lastDate=today;
    }
    if(ghostRec.length>8&&avg>db.ghostAvg){ db.ghost=ghostRec.slice(0,1200); db.ghostAvg=avg; newGhost=true; }
    save(); refreshStats();
  }
  $('#fEyebrow').textContent=wasRace?(finished?'RACE FINISHED':'RACE ABANDONED'):'RIDE COMPLETE';
  const stat=(k,v,u,hot)=>`<div class="stat${hot?' hot':''}"><div class="k">${k}</div><div class="v">${v}<small>${u}</small></div></div>`;
  $('#fStats').innerHTML=stat('距離',(d/1000).toFixed(2),'km')+stat('時間',mmss(sec),'')
    +stat('平均',avg.toFixed(1),'km/h')+stat('連続',db.streak,'日',true);
  if(wasRace&&finished){
    const rows=RIVALS.map(r=>({name:r.name,color:r.color,
      t:r.time!==null?r.time:sec+(raceLen-r.dist)/Math.max(r.spd/3.6,0.5)}))
      .concat([{name:'あなた',color:0xF0A93B,t:sec,me:true}]).sort((a,b)=>a.t-b.t);
    const mine=rows.findIndex(r=>r.me)+1;
    $('#fTitle').textContent=mine===1?'優勝！':mine+'位でゴール';
    $('#fRes').innerHTML=rows.map((r,i)=>
      `<div class="r${r.me?' me':''}"><span class="p">${i+1}</span>
       <span class="n"><span class="dot" style="background:#${r.color.toString(16).padStart(6,'0')}"></span>${r.name}</span>
       <span class="t">${mmss(r.t)}</span></div>`).join('');
  }else{
    $('#fTitle').textContent=newGhost?'ベスト更新':'おつかれさま';
    $('#fRes').innerHTML=newGhost
      ?'<div class="note" style="margin:0">この走行がゴーストとして保存されました。次のフリーライドでは、この自分が前を走ります。</div>'
      :(db.ghost?'<div class="note" style="margin:0">ゴーストの記録は更新されませんでした。</div>':'');
  }
  $('#finish').classList.remove('gone');
}

/* ========================================================= 15. CONTROLS */
$('#th').oninput=e=>{ TH=+e.target.value; $('#thV').textContent=TH.toFixed(1); };
$('#gv').oninput=e=>{ GEAR=+e.target.value; $('#gvV').textContent=Math.round(GEAR*60); };
$('#vol').oninput=e=>{ volume=+e.target.value/100; $('#volV').textContent=e.target.value;
  if(master) master.gain.setTargetAtTime(volume,ac.currentTime,0.1); };
$('#ws').oninput=e=>{ WORLD=+e.target.value; $('#wsV').textContent=WORLD.toFixed(1); };
$('#q').oninput=e=>setQuality(+e.target.value,false);
$('#gv').dispatchEvent(new Event('input'));
$('#gear').onclick=()=>$('#panel').classList.toggle('on');
$('#cam').onclick=()=>{ thirdPerson=!thirdPerson; };
$('#stop').onclick=()=>endRide(false);
$('#sim').onclick=e=>{ simOn=!simOn; e.target.classList.toggle('active',simOn); };
$('#lenSeg').onclick=e=>{
  const b=e.target.closest('button'); if(!b) return;
  raceLen=+b.dataset.len;
  [...$('#lenSeg').children].forEach(x=>x.classList.toggle('sel',x===b));
};
let armed=false;
async function armSensors(){
  if(armed) return; armed=true;
  try{
    if(typeof DeviceMotionEvent!=='undefined'&&typeof DeviceMotionEvent.requestPermission==='function'){
      const res=await DeviceMotionEvent.requestPermission();
      if(res!=='granted') $('#sim').textContent='センサーが拒否されました — テスト走行で動かす';
    }
  }catch(err){ $('#sim').textContent='センサーを使えません — テスト走行で動かす'; }
  window.addEventListener('devicemotion',onMotion);
  initAudio();
  try{ await navigator.wakeLock.request('screen'); }catch(err){}
  document.addEventListener('visibilitychange',async()=>{
    if(document.visibilityState==='visible'){
      last=performance.now();
      try{ await navigator.wakeLock.request('screen'); }catch(err){}
    }
  });
}
let lastKind='free';
async function launch(kind){ lastKind=kind; await armSensors(); if(ac&&ac.state==='suspended') ac.resume(); startRide(kind); }
$('#goFree').onclick=()=>launch('free');
$('#goRace').onclick=()=>launch('race');
$('#again').onclick=()=>launch(lastKind);
$('#home').onclick=()=>{ $('#finish').classList.add('gone'); $('#start').classList.remove('gone'); };
addEventListener('resize',()=>{
  camera.aspect=innerWidth/innerHeight;
  camera.updateProjectionMatrix();
  renderer.setSize(innerWidth,innerHeight);
});

refreshEnv();
updateWorld(0,0);
tick();
</script>
